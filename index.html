  arquivos.forEach(f => {
    const nome = enc.encode(f.nome), dados = enc.encode(f.texto), crc = crc32(dados);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 0, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, dados.length, true); lh.setUint32(22, dados.length, true);
    lh.setUint16(26, nome.length, true); lh.setUint16(28, 0, true);
    partes.push(new Uint8Array(lh.buffer), nome, dados);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, dados.length, true); ch.setUint32(24, dados.length, true);
    ch.setUint16(28, nome.length, true); ch.setUint32(42, desloc, true);
    central.push(new Uint8Array(ch.buffer), nome);
    desloc += 30 + nome.length + dados.length;
  });
  const tamCentral = central.reduce((a, x) => a + x.length, 0);
  const fim = new DataView(new ArrayBuffer(22));
  fim.setUint32(0, 0x06054b50, true);
  fim.setUint16(8, arquivos.length, true); fim.setUint16(10, arquivos.length, true);
  fim.setUint32(12, tamCentral, true); fim.setUint32(16, desloc, true);
  const todas = partes.concat(central, [new Uint8Array(fim.buffer)]);
  const total = todas.reduce((a, x) => a + x.length, 0);
  const saida = new Uint8Array(total);
  let pos = 0;
  todas.forEach(x => { saida.set(x, pos); pos += x.length; });

}
const xmlEsc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function colNome(n) { let s = ""; n++; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; }

  opcoes = opcoes || {};

    const r = i + 1;
    const cs = (cels || []).map((c, j) => {
      if (c == null || c === "") return "";
      const ref = colNome(j) + r;
      const est = c.s ? ` s="${c.s}"` : "";
      if (c.n != null) return `<c r="${ref}"${est}><v>${c.n}</v></c>`;
      return `<c r="${ref}"${est} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c.t != null ? c.t : c)}</t></is></c>`;
    }).join("");
    return `<row r="${r}"${opcoes.alturas && opcoes.alturas[r] ? ` ht="${opcoes.alturas[r]}" customHeight="1"` : ""}>${cs}</row>`;
  }).join("");
  const cols = opcoes.larguras ? `<cols>${opcoes.larguras.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("")}</cols>` : "";

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${congela}${cols}<sheetData>${corpo}</sheetData>${filtro}${merges}</worksheet>`;
}

function montaXlsx(abas) {
  const arquivos = [
    { nome: "[Content_Types].xml", texto: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
${abas.map((a, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
    { nome: "_rels/.rels", texto: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { nome: "xl/workbook.xml", texto: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>
${abas.map((a, i) => `<sheet name="${xmlEsc(a.nome)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>` },
    { nome: "xl/_rels/workbook.xml.rels", texto: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${abas.map((a, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}
<Relationship Id="rId${abas.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { nome: "xl/styles.xml", texto: ESTILOS }
  ];
  abas.forEach((a, i) => arquivos.push({ nome: `xl/worksheets/sheet${i + 1}.xml`, texto: abaXml(a.linhas, a.opcoes) }));
  return zipar(arquivos);
}
function baixarXlsx(nome, abas) {
  try {
    const blob = new Blob([montaXlsx(abas)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Relatório gerado.", true);
  } catch (e) { toast("Não consegui gerar aqui. Tente pelo computador."); }
}

function b64paraBytes(b64) {
  const bin = atob(b64), n = bin.length, arr = new Uint8Array(n);
  for (let i = 0; i < n; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
async function baixarModeloXlsx(b64, nome) {
  try {
    const blob = new Blob([b64paraBytes(b64)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Modelo baixado.", true);
  } catch (e) { toast("Não consegui baixar aqui. Tente pelo navegador do celular."); }
}
async function inflar(bytes, metodo) {
  if (metodo === 0) return bytes;
  if (typeof DecompressionStream === "undefined") throw new Error("sem-descompressao");
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function lerZip(buffer) {
  const dv = new DataView(buffer), bytes = new Uint8Array(buffer);
  let fim = -1;
  for (let i = bytes.length - 22; i >= 0 && i > bytes.length - 66000; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { fim = i; break; }
  }
  if (fim < 0) throw new Error("zip");
  const total = dv.getUint16(fim + 10, true);
  let p = dv.getUint32(fim + 16, true);
  const arquivos = {};
  for (let k = 0; k < total; k++) {
    const metodo = dv.getUint16(p + 10, true);
    const tamComp = dv.getUint32(p + 20, true);
    const nomeLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const comLen = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true);
    const nome = new TextDecoder().decode(bytes.slice(p + 46, p + 46 + nomeLen));
    const nl = dv.getUint16(off + 26, true), el = dv.getUint16(off + 28, true);
    const ini = off + 30 + nl + el;
    arquivos[nome] = { dados: bytes.slice(ini, ini + tamComp), metodo };
    p += 46 + nomeLen + extraLen + comLen;
  }
  return arquivos;
}
async function lerXlsx(file) {
  const buffer = await file.arrayBuffer();
  const zip = await lerZip(buffer);
  const texto = async nome => zip[nome] ? new TextDecoder().decode(await inflar(zip[nome].dados, zip[nome].metodo)) : "";
  const parser = new DOMParser();
  const compart = [];
  const ssXml = await texto("xl/sharedStrings.xml");
  if (ssXml) {
    const doc = parser.parseFromString(ssXml, "application/xml");
    Array.prototype.forEach.call(doc.getElementsByTagNameNS("*", "si"), si => {
      let s = "";
      Array.prototype.forEach.call(si.getElementsByTagNameNS("*", "t"), t => { s += t.textContent; });
      compart.push(s);
    });
  }
  let alvo = "xl/worksheets/sheet1.xml";
  if (!zip[alvo]) alvo = Object.keys(zip).find(k => /^xl\/worksheets\/.*\.xml$/.test(k));
  const doc = parser.parseFromString(await texto(alvo), "application/xml");
  const linhas = [];
  Array.prototype.forEach.call(doc.getElementsByTagNameNS("*", "row"), row => {
    const cols = [];
    Array.prototype.forEach.call(row.getElementsByTagNameNS("*", "c"), c => {
      const ref = (c.getAttribute("r") || "").replace(/\d+/g, "");
      let i = 0;
      for (let k = 0; k < ref.length; k++) i = i * 26 + (ref.charCodeAt(k) - 64);
      const tipo = c.getAttribute("t");
      const v = c.getElementsByTagNameNS("*", "v")[0], is = c.getElementsByTagNameNS("*", "is")[0];
      let val = "";
      if (tipo === "s" && v) val = compart[Number(v.textContent)] || "";
      else if (tipo === "inlineStr" && is) val = is.textContent;
      else if (v) val = v.textContent;
      cols[Math.max(0, i - 1)] = String(val).trim();
    });
    linhas.push(cols);
  });
  return linhas;
}
function matrizParaObjetos(linhas, alias) {
  let iCab = -1;
  for (let i = 0; i < Math.min(linhas.length, 12); i++) {
    const marcados = (linhas[i] || []).filter(c => alias[normCab(c)]).length;
    if (marcados >= 3) { iCab = i; break; }
  }
  if (iCab < 0) return [];
  const cab = (linhas[iCab] || []).map(c => alias[normCab(c)] || normCab(c));
  return linhas.slice(iCab + 1).filter(l => (l || []).some(c => String(c || "").trim())).map(l => {
    const o = {};
    cab.forEach((c, i) => { if (c) o[c] = String((l || [])[i] == null ? "" : (l || [])[i]).trim(); });
    return o;
  });
}
async function lerPlanilha(file, alias) {
  if (/\.xlsx$/i.test(file.name)) return matrizParaObjetos(await lerXlsx(file), alias);
  const texto = await file.text();
  const t = texto.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
  const sep = (t.split("\n")[0].match(/;/g) || []).length >= (t.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
  const linhas = [];
  let campo = "", linha = [], aspas = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (aspas) {
      if (ch === '"' && t[i + 1] === '"') { campo += '"'; i++; }
      else if (ch === '"') aspas = false;
      else campo += ch;
    } else if (ch === '"') aspas = true;
    else if (ch === sep) { linha.push(campo); campo = ""; }
    else if (ch === "\n") { linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
    else campo += ch;
  }
  if (campo.length || linha.length) { linha.push(campo); linhas.push(linha); }
  return matrizParaObjetos(linhas, alias);

function normCab(s) {
  return String(s || "").split("(")[0].normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/\*/g, "").trim().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");

function csvEscapa(v) {
  const s = String(v == null ? "" : v);

}
function montaCSV(linhas) {
  return [COLUNAS.map(c => csvEscapa(CABECALHOS[c])).join(";")]
    .concat(linhas.map(l => COLUNAS.map(c => csvEscapa(l[c])).join(";"))).join("\r\n");
}
function leCSV(texto) {
  const t = texto.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
  const sep = (t.split("\n")[0].match(/;/g) || []).length >= (t.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
  const linhas = []; let campo = "", linha = [], aspas = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (aspas) {
      if (ch === '"' && t[i + 1] === '"') { campo += '"'; i++; }
      else if (ch === '"') aspas = false;
      else campo += ch;
    } else if (ch === '"') aspas = true;
    else if (ch === sep) { linha.push(campo); campo = ""; }
    else if (ch === "\n") { linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
    else campo += ch;
  }
  if (campo.length || linha.length) { linha.push(campo); linhas.push(linha); }
  if (!linhas.length) return [];
  const cab = linhas[0].map(c => ALIAS[normCab(c)] || normCab(c));
  return linhas.slice(1).filter(l => l.some(c => String(c).trim())).map(l => {
    const o = {}; cab.forEach((c, i) => { o[c] = (l[i] || "").trim(); }); return o;
  });
}
async function salvaArquivo(nome, texto) {
  const dados = "\uFEFF" + texto;

    if (d) { await d.save({ filename: nome, data: dados }); toast("Planilha salva.", true); return; }
  } catch (e) { }
  try {
    const blob = new Blob([dados], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Planilha baixada.", true);
  } catch (e) { toast("Não consegui baixar aqui. Use Copiar para colar na planilha."); }
}

function dataPlanilha(v) {
  const s = String(v == null ? "" : v).trim();
  if (!s) return "";
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const br = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if (br) return `${br[3]}-${br[2]}-${br[1]}`;
  const n = Number(s);
  if (!isNaN(n) && n > 20000 && n < 60000) {
    const d = new Date(Date.UTC(1899, 11, 30) + n * 86400000);
    return d.toISOString().slice(0, 10);
  }
  const d2 = new Date(s);
  return isNaN(d2) ? "" : d2.toISOString().slice(0, 10);
}
function montaRegras(l, antes) {

  const regras = [{ desc: "Aluguel", tipo: "Aluguel", valor: num(l.aluguel), recebedor: "proprietario" }];
  if (sim(l.condominio_por_boleto)) regras.push({ desc: "Condomínio", tipo: "Condomínio", valor: antes.cond || 0, recebedor: "proprietario", boleto: true });
  if (sim(l.agua_variavel)) regras.push({ desc: "Água", tipo: "Água", valor: antes.agua || 0, recebedor: "proprietario", variavel: true });
  if (sim(l.luz_variavel)) regras.push({ desc: "Energia", tipo: "Luz", valor: antes.luz || 0, recebedor: "proprietario", variavel: true });
  String(l.outras_despesas || "").split(";").forEach(par => {
    const [d, v] = par.split("=");
    if (d && v) regras.push({ desc: d.trim(), tipo: "Outros", valor: num(v), recebedor: "imobiliaria" });
  });
  if (num(l.taxa_administrativa)) regras.push({ desc: "Taxa administrativa", tipo: "Taxa administrativa", valor: num(l.taxa_administrativa), recebedor: "imobiliaria" });
  return regras;
}

function cpfLivre(cpf, exceto) {
  const d = cpfNorm(cpf);
  if (d.length !== 11) return false;
  const bate = x => x.id !== exceto && cpfIgual(x.cpf, d);
  return !(S.pessoas || []).some(bate) && !(S.usuarios || []).some(bate);
}
function achaCadastro(email, cpf) {
  const e = (email || "").toLowerCase(), d = cpfNorm(cpf || "");
  const bate = x => (e && (x.email || "").toLowerCase() === e) || cpfIgual(x.cpf, d);
  const u = (S.usuarios || []).find(bate); if (u) return { alvo: u, tipo: "equipe" };
  const p = S.pessoas.find(bate); if (p) return { alvo: p, tipo: "pessoa" };
  return null;
}
const num0 = v => Number(String(v || "").replace(/\./g, "").replace(",", ".")) || 0;
function analisaImportacao(dados) {
  const linhas = dados || [];
  const novos = [], erros = [];
  let ignoradas = 0;
  linhas.forEach((l, i) => {
    const n = i + 5;
    if (!String(l.tipo || "").trim() && !String(l.nome || "").trim() && !String(l.cpf || "").trim() && !String(l.email || "").trim()) return;
    if (/ignor/i.test(l.acao || "")) { ignoradas++; return; }
    const tipo = TIPO_PLANILHA[normCab(l.tipo || "")];
    if (!tipo) { erros.push(`Linha ${n}: identificador "${l.tipo || "vazio"}" não reconhecido.`); return; }
    if (!l.nome) { erros.push(`Linha ${n}: falta o nome.`); return; }
    const email = (l.email || "").toLowerCase();
    if (cpfNorm(l.cpf || "").length !== 11) { erros.push(`Linha ${n}: ${l.nome} está sem CPF válido.`); return; }
    const repetidoNoArquivo = novos.some(x => (email && x.email === email) || cpfIgual(x.cpf, l.cpf));
    if (repetidoNoArquivo) { erros.push(`Linha ${n}: ${l.nome} aparece duas vezes na planilha.`); return; }
    const existe = achaCadastro(email, l.cpf);
    if (tipo === "inquilino" && String(l.imovel || "").trim()) {
      const pe = (l.proprietario_email || "").trim().toLowerCase();
      if (!pe) { erros.push(`Linha ${n}: ${l.nome} tem imóvel preenchido, mas falta o e-mail do proprietário que liga a locação.`); return; }
      const naPlanilha = linhas.some(x => (x.email || "").trim().toLowerCase() === pe && /propriet|locador/.test(normCab(x.tipo)));
      const cadastrado = S.pessoas.some(x => (x.email || "").toLowerCase() === pe) || (S.usuarios || []).some(x => (x.email || "").toLowerCase() === pe);
      if (!naPlanilha && !cadastrado) { erros.push(`Linha ${n}: o proprietário ${pe} não está nesta planilha nem cadastrado no sistema.`); return; }
      if (!num0(l.aluguel)) { erros.push(`Linha ${n}: ${l.nome} tem imóvel preenchido, mas falta o valor do aluguel.`); return; }
    }
    novos.push(Object.assign({}, l, { tipo, email, acao: "atualizar", jaExiste: existe ? existe.alvo.id : null, jaTipo: existe ? existe.tipo : null }));
  });
  S.ui.importPrevia = novos;
  const box = document.getElementById("previa"), btn = document.getElementById("btn_importar");
  if (!box) return;
  const cont = t => novos.filter(x => x.tipo === t && !x.jaExiste).length;
  const repetidos = novos.filter(x => x.jaExiste);
  const locs = novos.filter(x => x.tipo === "inquilino" && x.imovel && !x.jaExiste).length;
  const entram = novos.length;
  box.innerHTML = `<div class="lane" style="border-left-color:var(--${erros.length ? "warn" : "ok"});background:var(--surface-2);margin-bottom:14px">
    <div class="small" style="font-weight:500">${entram} ${entram === 1 ? "registro será processado" : "registros serão processados"}</div>
    <div class="small muted">${cont("inquilino")} inquilinos novos · ${cont("proprietario")} proprietários novos · ${cont("equipe")} da equipe · ${locs} ${locs === 1 ? "locação nova" : "locações novas"}</div>
    ${repetidos.length ? `<div class="small" style="margin-top:8px">${repetidos.length} ${repetidos.length === 1 ? "cadastro será atualizado" : "cadastros serão atualizados"} conforme a coluna Ação: ${esc(repetidos.slice(0, 4).map(r => r.nome).join(", "))}${repetidos.length > 4 ? " e outros" : ""}.</div>` : ""}
    ${erros.length ? `<div class="small" style="color:var(--warn);margin-top:8px">${erros.length} ${erros.length === 1 ? "linha ignorada" : "linhas ignoradas"}:</div>
      <div class="tiny muted">${erros.slice(0, 8).map(esc).join("<br>")}${erros.length > 8 ? "<br>…" : ""}</div>` : ""}
  </div>`;
  if (btn) { btn.disabled = !entram; btn.textContent = entram ? `Importar ${entram} ${entram === 1 ? "registro" : "registros"}` : "Nada para importar"; }
}
A.importModo = el => { S.ui.importModo = el.value; const p = S.ui.importPrevia; if (p) { S.ui.importPrevia = p; analisaPrevia(); } };
function analisaPrevia() {
  const box = document.getElementById("previa"), btn = document.getElementById("btn_importar");
  if (!box) return;
  const novos = S.ui.importPrevia || [];
  const repetidos = novos.filter(x => x.jaExiste);
  const entram = novos.length;
  const linha = box.querySelector(".small");
  if (linha) linha.textContent = `${entram} ${entram === 1 ? "registro será processado" : "registros serão processados"}`;
  if (btn) { btn.disabled = !entram; btn.textContent = entram ? `Importar ${entram} ${entram === 1 ? "registro" : "registros"}` : "Nada para importar"; }
}
A.importarOK = () => {
  const todos = S.ui.importPrevia || [];
  const novos = todos.filter(l => !l.jaExiste);
  const repetidos = todos.filter(l => l.jaExiste);
  if (!novos.length && !repetidos.length) return;
  const num = v => Number(String(v || "").replace(/\./g, "").replace(",", ".")) || 0;
  const criados = { pessoas: 0, equipe: 0, locacoes: 0, atualizados: 0 };
  const naoVinculadas = [];
  repetidos.forEach(l => {
    const alvo = l.jaTipo === "equipe" ? S.usuarios.find(u => u.id === l.jaExiste) : pessoa(l.jaExiste);
    if (!alvo) return;
    alvo.nome = l.nome || alvo.nome;
    if (l.email) alvo.email = l.email;
    if (l.cpf) alvo.cpf = l.cpf;
    if (l.telefone) alvo.tel = l.telefone;
    if (l.canal) alvo.canal = l.canal;
    if (l.senha) alvo.senha = l.senha;
    if (l.cargo && l.jaTipo === "equipe") alvo.cargo = l.cargo;
    criados.atualizados++;
    if (l.jaTipo === "pessoa" && l.imovel) {
      const loc = S.locacoes.find(x => x.inquilinoId === alvo.id && imovel(x.imovelId).apelido.trim().toLowerCase() === l.imovel.trim().toLowerCase());
      if (loc) {
        const im = imovel(loc.imovelId);
        if (l.endereco) im.endereco = l.endereco;
        if (num(l.aluguel)) { const r = loc.regras.find(r => r.tipo === "Aluguel"); if (r) r.valor = num(l.aluguel); }
        if (num(l.taxa_administrativa)) { const r = loc.regras.find(r => r.tipo === "Taxa administrativa"); if (r) r.valor = num(l.taxa_administrativa); else loc.regras.push({ desc: "Taxa administrativa", tipo: "Taxa administrativa", valor: num(l.taxa_administrativa), recebedor: "imobiliaria" }); }
        if (Number(l.dia_vencimento)) loc.diaVenc = Math.min(28, Math.max(1, Number(l.dia_vencimento)));
        log(loc.id, null, "Dados da locação atualizados pela importação de planilha.", origemAtual());
      }
    }
  });
  novos.filter(l => l.tipo === "equipe").forEach(l => {
    S.usuarios.push({ id: uid("u"), nome: l.nome, cpf: cpfNorm(l.cpf), cargo: l.cargo || "", email: l.email, senha: l.senha || SENHA, perfil: "imobiliaria", ativo: true, senhaProvisoria: true, perms: { mensagens: true } });
    criados.equipe++;
  });
  novos.filter(l => l.tipo !== "equipe").forEach(l => {
    S.pessoas.push({
      id: uid("p"), senhaProvisoria: true, nome: l.nome, cpf: cpfNorm(l.cpf), email: l.email || "—", tel: l.telefone || "—",
      canal: l.canal || "Portal", senha: l.senha || SENHA, papelPrevisto: l.tipo, origemCadastro: "planilha", criadoEm: agora()
    });
    criados.pessoas++;
  });
  novos.filter(l => l.tipo === "inquilino" && l.imovel).forEach(l => {
    const inq = S.pessoas.find(p => cpfIgual(p.cpf, l.cpf))
      || S.pessoas.find(p => (p.email || "").toLowerCase() === l.email && l.email);
    const pe = (l.proprietario_email || "").toLowerCase();
    const prop = S.pessoas.find(p => (p.email || "").toLowerCase() === pe && pe);
    if (!inq || !prop) { naoVinculadas.push(l.imovel + " (" + l.nome + ")"); return; }
    if (S.locacoes.some(x => x.inquilinoId === inq.id && imovel(x.imovelId).apelido.trim().toLowerCase() === String(l.imovel).trim().toLowerCase())) return;
    const im = { id: uid("i"), apelido: l.imovel, endereco: l.endereco || "Endereço não informado", tipo: "Imóvel" };
    S.imoveis.push(im);
    const regras = [{ desc: "Aluguel", tipo: "Aluguel", valor: num(l.aluguel), recebedor: "proprietario" }];
    if (/^s/i.test(l.condominio_por_boleto || "")) regras.push({ desc: "Condomínio", tipo: "Condomínio", valor: 0, recebedor: "proprietario", boleto: true });
    if (/^s/i.test(l.agua_variavel || "")) regras.push({ desc: "Água", tipo: "Água", valor: 0, recebedor: "proprietario", variavel: true });
    if (/^s/i.test(l.luz_variavel || "")) regras.push({ desc: "Energia", tipo: "Luz", valor: 0, recebedor: "proprietario", variavel: true });
    if (num(l.taxa_administrativa)) regras.push({ desc: "Taxa administrativa", tipo: "Taxa administrativa", valor: num(l.taxa_administrativa), recebedor: "imobiliaria" });
    const loc = {
      id: uid("l"), driveUrl: "", contratoUrl: "", imovelId: im.id, inquilinoId: inq.id, proprietarioId: prop.id,
      inicio: hojeISO(), fim: "", diaVenc: Math.min(28, Math.max(1, Number(l.dia_vencimento) || 10)),
      multa: "2% + 1% ao mês", pixImob: S.imobiliaria.pix, pixProp: prop.email !== "—" ? prop.email : "",
      recebimentoProp: { forma: "PIX", chaveTipo: "E-mail", chave: prop.email !== "—" ? prop.email : "" }, regras
    };
    S.locacoes.push(loc);
    achaOuCriaCobranca(loc.id, S.competencia);
    log(loc.id, S.competencia, `Locação criada pela importação de planilha, com cobrança de ${compLabel(S.competencia)}.`, origemAtual());
    criados.locacoes++;
  });
  marca("usuarios"); marca("importacao");
  S.ui.importPrevia = null; S.ui.importModo = "ignorar"; marca("planilhaAltha");
  fecharModal(); save(); render();
  const partes = [];
  if (criados.pessoas + criados.equipe) partes.push(`${criados.pessoas + criados.equipe} acessos criados`);
  if (criados.locacoes) partes.push(`${criados.locacoes} locações geradas`);
  if (criados.atualizados) partes.push(`${criados.atualizados} cadastros atualizados`);
  if (naoVinculadas.length) partes.push(`${naoVinculadas.length} locações não vinculadas`);
  toast(partes.join(" · ") || "Nada a fazer.", true);
};

        <span class="tiny muted">${it.recebedor === "imobiliaria" ? esc(S.imobiliaria.nome) : "proprietário"} · cheio ${money(it.valor)}${it.variavel && !Number(it.valor) ? " · ainda a lançar" : ""}</span></span>
        <input type="checkbox" class="prop" id="pp_${k}" data-k="${k}" style="width:auto" ${Number(it.valor) ? "checked" : ""}></label>`).join("")}

    `<button class="btn primary block" data-act="proporcionalOK" data-id="${c.id}">Aplicar na cobrança</button>`);
  const calc = () => {
    const d1 = new Date($("#m_de").value + "T12:00"), d2 = new Date($("#m_ate").value + "T12:00");
    const usados = Math.min(dias, Math.max(0, Math.round((d2 - d1) / 86400000) + 1));
    const marcados = [];
    c.itens.forEach((it, k) => { const e = $("#pp_" + k); if (e && e.checked) marcados.push({ k: k, valor: Math.round(Number(it.valor) * usados / dias * 100) / 100, desc: it.desc, cheio: Number(it.valor) }); });
    S.ui.prop = { usados: usados, dias: dias, de: $("#m_de").value, ate: $("#m_ate").value, itens: marcados };

    const cheio = marcados.reduce((a, x) => a + x.cheio, 0);
    $("#previa_prop").innerHTML = `<div class="tiny muted">Cálculo · base de 30 dias · ${usados} ${usados === 1 ? "dia" : "dias"}</div>
      ${marcados.length ? marcados.map(x => `<div class="spread small"><span class="muted">${esc(x.desc)}</span><span class="money">${money(x.cheio)} → ${money(x.valor)}</span></div>`).join("") : `<div class="small muted">Nada marcado.</div>`}
      ${marcados.length ? `<div class="spread small" style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px"><span style="font-weight:500">Total</span><span class="money" style="font-weight:500">${money(cheio)} → ${money(total)}</span></div>` : ""}`;
  };
  ["m_de", "m_ate"].forEach(id => { const e = $("#" + id); if (e) e.addEventListener("input", calc); });
  document.querySelectorAll(".prop").forEach(e => e.addEventListener("change", calc));

};

  log(l.id, S.competencia, `Locação cadastrada e cobrança de ${compLabel(S.competencia)} gerada a partir das regras financeiras.`, origemAtual());
  marca("locacao");
  fecharModal(); save(); go("adm.locacao", { locacaoId: l.id, cobrancaId: c.id, tab: "resumo" });
  toast("Locação cadastrada e cobrança gerada.", true);
};

/* ============ eventos ============ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) return;
  const fn = A[el.dataset.act];
  if (fn) { if (el.tagName !== "A") e.preventDefault(); fn(el); }
});
document.addEventListener("change", e => {
  const g = e.target.closest("[data-act]");
  if (g && g.tagName === "SELECT" && g.dataset.act !== "filtro" && A[g.dataset.act]) { A[g.dataset.act](g); return; }
  const el = e.target.closest("[data-act='filtro']"); if (!el) return;
  S.ui.filtro = Object.assign({}, S.ui.filtro, { [el.dataset.k]: el.value });
  save(); render();
});
document.addEventListener("input", e => {
  const cfg = e.target.closest("[data-act='cfgInput'],[data-act='cfgPasta'],[data-act='cfgTipo']");
  if (cfg) { A[cfg.dataset.act](cfg); return; }
  const el = e.target.closest("[data-act='filtro']"); if (!el || el.tagName !== "INPUT") return;
  S.ui.filtro = Object.assign({}, S.ui.filtro, { [el.dataset.k]: el.value });
  save(); render();
  const again = document.getElementById(el.id);
  if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") fecharModal();
  if (e.key === "Enter" && !MODAL && (e.target.id === "lg_user" || e.target.id === "lg_pass")) { e.preventDefault(); A.login(); }
});

/* ============ render ============ */
function render() {
  const app = document.getElementById("app");
  const p = S.ui.perfil;
  if (p && S.ui.trocarSenha) { app.innerHTML = viewTrocarSenha(); return; }
  if (!p) app.innerHTML = viewLogin();
  else if (p === "imobiliaria") app.innerHTML = viewAdmin();
  else if (p === "inquilino") app.innerHTML = viewInquilino();
  else app.innerHTML = viewProprietario();
}

S = seed();
S.ui = { perfil: null, pessoaId: null, view: "login", tab: "resumo", filtro: {} };
try {
  const uiSalva = JSON.parse(localStorage.getItem(KEY + "_ui") || "null");
  if (uiSalva && uiSalva.ui) S.ui = Object.assign(S.ui, uiSalva.ui, { loginPass: "", loginErro: null });
} catch (e) { }
render();
iniciarSync();

</script>
