<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal de Gestão de Locações e Cobranças — piloto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F1EB; --surface:#FFFFFF; --surface-2:#FAF7F2; --sunken:#EFE7DC;
  --ink:#232120; --ink-2:#404042; --muted:#7D746A; --line:#E6DDD1; --line-2:#D6C9B7;
  --brand:#A77E44; --brand-2:#8E6832; --brand-soft:#F3EADC; --on-brand:#FFFFFF;
  --prop:#3F5A63; --prop-soft:#E4EBEE;
  --ok:#3D7A57; --ok-soft:#E2EFE6; --warn:#A2740F; --warn-soft:#F8EED6; --bad:#A4352C; --bad-soft:#F7E2DF;
  --shadow:0 1px 2px rgba(60,45,25,.05), 0 10px 30px -20px rgba(60,45,25,.35);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15120E; --surface:#1D1914; --surface-2:#252019; --sunken:#0E0B08;
    --ink:#F1EAE0; --ink-2:#DCD3C7; --muted:#A79B8B; --line:#332B22; --line-2:#463B2E;
    --brand:#D6A867; --brand-2:#E7BF86; --brand-soft:#3A2C19; --on-brand:#1C1509;
    --prop:#9CC1CD; --prop-soft:#1E2E34;
    --ok:#7BC195; --ok-soft:#16301F; --warn:#DFB35F; --warn-soft:#332611; --bad:#EB9188; --bad-soft:#37201C;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
    --paper:#15120E; --surface:#1D1914; --surface-2:#252019; --sunken:#0E0B08;
    --ink:#F1EAE0; --ink-2:#DCD3C7; --muted:#A79B8B; --line:#332B22; --line-2:#463B2E;
    --brand:#D6A867; --brand-2:#E7BF86; --brand-soft:#3A2C19; --on-brand:#1C1509;
    --prop:#9CC1CD; --prop-soft:#1E2E34;
    --ok:#7BC195; --ok-soft:#16301F; --warn:#DFB35F; --warn-soft:#332611; --bad:#EB9188; --bad-soft:#37201C;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{margin:0; font-weight:500; line-height:1.2}
h1{font-family:var(--serif); font-size:1.85rem; font-weight:500; letter-spacing:.005em}
h2{font-size:1.06rem; font-weight:500; letter-spacing:.01em}
h3{font-size:.95rem; font-weight:500} h4{font-size:.88rem;font-weight:500}
p{margin:0 0 .6em}
a{color:var(--brand)}
button{font:inherit; color:inherit}
:focus-visible{outline:2.5px solid var(--brand-2); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:no-preference){
  .sheet,.modal-card{animation:rise .22s cubic-bezier(.2,.8,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:.45em;justify-content:center;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);padding:.62em 1em;border-radius:6px;cursor:pointer;font-weight:400;
  text-align:center;transition:background .12s ease,border-color .12s ease}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.primary{color:var(--on-brand)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:500}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand);padding:.5em .6em}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:.42em .7em;font-size:.86rem;border-radius:6px}
.btn.cta{text-transform:uppercase;letter-spacing:.14em;font-size:.82rem;padding:.85em 1em}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.tiny{font-size:.76rem}
.mono-num{font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--line);border:0;margin:14px 0}
.money{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tag{display:inline-flex;align-items:center;gap:.35em;border-radius:999px;padding:.2em .6em;font-size:.76rem;font-weight:600;
  border:1px solid transparent;white-space:nowrap}
.tag.pago{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.tag.pendente{background:var(--sunken);color:var(--ink-2);border-color:var(--line-2)}
.tag.analise{background:var(--brand-soft);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 30%,transparent)}
.tag.parcial{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 32%,transparent)}
.tag.atrasado{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.tag.cancelado{background:transparent;color:var(--muted);border-color:var(--line-2)}
.tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field > label{font-size:.78rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);
  border-radius:6px;padding:.62em .75em;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
input[type=file]{padding:.42em;background:var(--surface-2)}
textarea{min-height:76px;resize:vertical}
.hint{font-size:.78rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1220px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brandmark{display:flex;align-items:center;gap:10px}
.logo-mark{width:24px;height:28px;flex:none;color:var(--ink)}
.logo-word{display:flex;flex-direction:column;line-height:1}
.logo-word b{font-family:var(--serif);font-weight:500;font-size:1.06rem;letter-spacing:.22em;text-transform:uppercase}
.logo-word i{font-style:normal;font-size:.5rem;letter-spacing:.42em;color:var(--muted);margin-top:3px;text-transform:uppercase}
.logo-stack{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink)}
.logo-stack .logo-mark{width:62px;height:70px}
.logo-stack b{font-family:var(--serif);font-weight:500;font-size:1.7rem;letter-spacing:.26em;text-transform:uppercase;margin-left:.26em}
.logo-stack i{font-style:normal;font-size:.62rem;letter-spacing:.48em;color:var(--muted);text-transform:uppercase;margin-left:.48em}
.whoami{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:.3em .38em .3em .8em;font-size:.84rem}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;
  background:var(--brand-soft);color:var(--brand);flex:none}
.shell{max-width:1220px;margin:0 auto;padding:18px 16px 96px;display:grid;gap:20px}
.shell > main{min-width:0}
.shell > main *{max-width:100%}
.shell.admin{grid-template-columns:212px minmax(0,1fr)}
@media (max-width:900px){.shell.admin{grid-template-columns:minmax(0,1fr)}}
.client-shell{max-width:560px;margin:0 auto;padding:16px 14px 110px}
.rail{align-self:start;position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
@media (max-width:900px){.rail{display:none}}
.admin-tabbar{display:none}
@media (max-width:900px){
  .admin-tabbar{display:block}
  .shell.admin{padding-bottom:104px}
}
.tabbar .badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--bad);color:#fff;border-radius:999px;
  min-width:16px;height:16px;padding:0 4px;font-size:.62rem;line-height:16px;text-align:center;font-weight:600}
.tabbar button{position:relative}
.badge-dot{position:absolute;top:-6px;right:-10px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--bad);color:#fff;font-size:.66rem;font-weight:700;display:grid;place-items:center;line-height:1}
.sheet-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line);padding:14px 4px;cursor:pointer;font-size:.95rem;color:var(--ink)}
.sheet-item:last-child{border-bottom:0}
.sheet-item .count{margin-left:auto;font-size:.74rem;font-weight:600;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:.1em .5em}
.rail button{display:flex;align-items:center;gap:11px;background:transparent;border:0;border-radius:11px;padding:.62em .8em;
  cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left;white-space:nowrap;font-size:.94rem;
  transition:background .14s ease,color .14s ease}
.rail button .grow{flex:1}
.rail-ic{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.rail button:hover{background:var(--surface-2);color:var(--ink)}
.rail button:hover .rail-ic{opacity:1}
.rail button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow);font-weight:600}
.rail button.on .rail-ic{opacity:1;stroke-width:1.9}
.rail-sep{height:1px;background:var(--line);margin:8px 10px}
.rail .count{margin-left:auto;font-size:.72rem;font-weight:700;background:var(--bad);color:#fff;
  border-radius:999px;padding:.12em .5em;min-width:20px;text-align:center}

/* ---------- client bottom nav ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar-in{max-width:560px;margin:0 auto;display:flex}
.tabbar button{flex:1;background:transparent;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:.4em .2em;font-size:.7rem;font-weight:600;color:var(--muted);border-radius:10px}
.tabbar button.on{color:var(--brand);background:var(--brand-soft)}
.tabbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- hero amount ---------- */
.amount-hero{font-size:clamp(2.5rem,12vw,3.4rem);font-weight:600;letter-spacing:-.035em;line-height:1;margin:.12em 0 .1em}
.amount-hero .cents{font-size:.5em;font-weight:500;letter-spacing:-.01em}

/* ---------- recebedor lanes ---------- */
.lane{border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--r-sm);
  background:var(--surface);padding:12px 14px}
.lane.prop{border-left-color:var(--prop)}
.lane .who{font-size:.78rem;font-weight:700;color:var(--brand)}
.lane.prop .who{color:var(--prop)}
.itemline{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.itemline:last-child{border-bottom:0}
.pixbox{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px dashed var(--line-2);
  border-radius:9px;padding:.5em .65em;font-size:.82rem}
.pixbox code{font-family:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:.88rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:.76rem;font-weight:700;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- misc blocks ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-size:1.3rem;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kpi.attn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.kpi.late{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
@media (max-width:620px){
  .tabs{flex-wrap:wrap;overflow:visible;gap:2px}
  .tabs button{flex:1 0 30%;padding:.55em .4em;font-size:.86rem;border:1px solid var(--line);border-radius:var(--r-sm);
    border-bottom:2px solid var(--line);background:var(--surface)}
  .tabs button.on{border-color:var(--brand);border-bottom-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:.6em .8em;cursor:pointer;
  color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 16px 22px;border-left:1px solid var(--line);margin-left:5px}
.timeline li:last-child{border-left-color:transparent;padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:-4.5px;top:6px;width:8px;height:8px;border-radius:50%;
  background:var(--brand);border:2px solid var(--surface)}
.filelist{display:flex;flex-direction:column;gap:8px}
.file{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;background:var(--surface)}
.file .ico{width:30px;height:36px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-2);
  display:grid;place-items:center;font-size:.62rem;font-weight:700;color:var(--muted);flex:none}
.file.user{align-items:flex-start}
.file.user .grow{min-width:0}
.file.user .grow > span{display:block;overflow-wrap:anywhere}
@media (max-width:620px){
  .file.user{flex-wrap:wrap}
  .file.user .grow{flex:1 1 100%}
  .file.user > .stack{width:100%;align-items:stretch}
  .file.user .row{flex-wrap:wrap}
  .file.user .row .btn{flex:1 1 44%}
  .file.user .tag{align-self:flex-start}
}
.emptybox{border:1px dashed var(--line-2);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);background:var(--surface-2)}
.checkrow{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.checkrow:last-child{border-bottom:0}
.checkbox{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--line-2);flex:none;display:grid;place-items:center;
  font-size:.7rem;color:transparent;margin-top:1px}
.checkrow.done .checkbox{background:var(--ok);border-color:var(--ok);color:#fff}
.checkrow.done .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}

/* ---------- login ---------- */
.login{min-height:100dvh;display:grid;place-items:center;padding:34px 16px}
.login-in{width:100%;max-width:430px}
.login-head{text-align:center;margin-bottom:6px}
.login-head .logo-stack{margin-bottom:22px}
.rolecard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:15px;cursor:pointer;box-shadow:var(--shadow)}
.rolecard:hover{border-color:var(--brand);background:var(--surface-2)}
.rolecard .glyph{width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none;
  font-family:var(--serif);font-size:1.05rem;font-weight:500;letter-spacing:.06em}
.rolecard .chev{color:var(--brand)}
.login-err{background:var(--bad-soft);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);
  border-radius:var(--r-sm);padding:.6em .8em;font-size:.84rem;margin-bottom:14px}
.linkbtn{background:none;border:0;color:var(--brand);cursor:pointer;font-size:.84rem;padding:0;text-decoration:underline;text-underline-offset:3px}
.pwwrap{position:relative}
.pwwrap .linkbtn{position:absolute;right:10px;top:9px;text-decoration:none;font-size:.76rem;text-transform:uppercase;letter-spacing:.08em}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,25,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:640px){.scrim{align-items:center;padding:24px}}
.modal-card{background:var(--surface);width:100%;max-width:560px;max-height:92dvh;overflow:auto;
  border-radius:18px 18px 0 0;border:1px solid var(--line);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:640px){.modal-card{border-radius:var(--r)}}
.modal-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;
  display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:2}
.modal-body{padding:18px}
.iconbtn{background:transparent;border:0;cursor:pointer;color:var(--muted);font-size:1.3rem;line-height:1;padding:.2em .4em;border-radius:8px}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.lbl-short{display:none}
@media (max-width:560px){
  .brandmark .logo-word{display:none}
  .lbl-long{display:none}
  .lbl-short{display:inline}
  .topbar-in{padding:9px 12px}
  .whoami{padding:.28em .32em .28em .7em;font-size:.8rem}
}
.row.even{align-items:stretch}
@media (max-width:620px){
  .spread.wrap{flex-direction:column;align-items:stretch;gap:10px}
  .spread.wrap > .row{width:100%}
  .spread.wrap > .row .btn{flex:1}
  h1{font-size:1.55rem}
}
.row.even .btn{flex:1}

/* ---------- toast ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:80;display:flex;flex-direction:column;gap:8px;
  width:calc(100% - 32px);max-width:420px;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);border-radius:11px;padding:.7em .9em;font-size:.86rem;box-shadow:var(--shadow)}
.toast.ok{background:var(--ok);color:#fff}

/* ---------- documents (recibo / boleto / demonstrativo) ---------- */
.doc-paper{font-family:var(--serif);font-size:16px;background:#fff;color:#16222A;border:1px solid var(--line);
  border-radius:8px;padding:26px;font-size:15px;line-height:1.6}
.doc-paper h3{font-family:inherit;font-size:1.45rem;font-weight:500;letter-spacing:.02em}
.doc-paper table{min-width:0;font-family:var(--sans);font-size:.85rem}
.doc-paper th,.doc-paper td{border-bottom:1px solid #E7DFD3;padding:7px 4px;background:transparent;color:#232120;position:static;white-space:normal}
.doc-rule{border:0;border-top:1px solid #DDE2DC;margin:14px 0}
.boleto-line{font-family:var(--sans);letter-spacing:.04em;font-size:.82rem;word-break:break-all}

#print-area{display:none}
@media print{
  body{background:#fff}
  .app-root,.topbar,.tabbar,.toasts,.scrim{display:none !important}
  #print-area{display:block;padding:0}
  .doc-paper{border:0;padding:0}
}
</style>
</head>
<body>
<div id="print-area"></div>
<div id="app" class="app-root"></div>
<div class="toasts" id="toasts"></div>
<script>
"use strict";
/* ============ utilidades ============ */
const KEY = "altha_portal_piloto_v24";
const VERSAO = 24;
const EXTERNA = "Atendimento direto";
const PORTAL = "Portal";
const BRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });

function pode(k) {

function go(view, opts) { Object.assign(S.ui, { view }, opts || {}); save(); render(); window.scrollTo({ top: 0 }); }
function toast(msg, ok) {
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast" + (ok ? " ok" : ""); el.textContent = msg; box.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(() => el.remove(), 320); }, 3200);
}
function copiarTexto(txt, msg) {
  const done = () => toast(msg || "Copiado.", true);
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(txt).then(done, () => fallback()); } else fallback();
  function fallback() {
    const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Não consegui copiar automaticamente."); }
    ta.remove();
  }
}
function copiar(txt) {
  const done = () => toast("Chave PIX copiada.", true);
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(txt).then(done, () => fallback()); } else fallback();
  function fallback() {
    const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Copie manualmente: " + txt); }
    ta.remove();
  }
}

function contas() {
  const c = (S.usuarios || []).filter(u => u.ativo !== false).map(u => ({
    id: u.id, login: u.email, cpf: u.cpf || "", nome: u.nome, senha: u.senha, perfil: "imobiliaria", pessoaId: null, papel: "Painel da imobiliária", cargo: u.cargo || ""
  }));
  S.locacoes.forEach(l => {
    const i = pessoa(l.inquilinoId), o = pessoa(l.proprietarioId);
    if (i.ativo !== false && !c.some(x => x.pessoaId === i.id)) c.push({ id: i.id, login: i.email, cpf: i.cpf, nome: i.nome, senha: i.senha, perfil: "inquilino", pessoaId: i.id, papel: "Portal do inquilino" });
    if (o.ativo !== false && !c.some(x => x.pessoaId === o.id)) c.push({ id: o.id, login: o.email, cpf: o.cpf, nome: o.nome, senha: o.senha, perfil: "proprietario", pessoaId: o.id, papel: "Portal do proprietário" });
  });
  S.pessoas.filter(p => p.papelPrevisto && p.ativo !== false && !c.some(x => x.pessoaId === p.id)).forEach(p => {
    c.push({ id: p.id, login: p.email, cpf: p.cpf, nome: p.nome, senha: p.senha, perfil: p.papelPrevisto, pessoaId: p.id,
      papel: p.papelPrevisto === "inquilino" ? "Portal do inquilino" : "Portal do proprietário" });
  });
  return c;
}

function admCobrancas() {
  const f = S.ui.filtro || {};
  const comp = f.competencia || S.competencia;
  let cs = S.cobrancas.filter(c => c.competencia === comp);
  if (f.status) cs = cs.filter(c => statusGeral(c) === f.status);
  if (f.busca) {
    const q = f.busca.toLowerCase();
    cs = cs.filter(c => { const l = locacao(c.locacaoId); return (pessoa(l.inquilinoId).nome + " " + imovel(l.imovelId).apelido + " " + pessoa(l.proprietarioId).nome).toLowerCase().includes(q); });
  }
  cs.sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  const comps = [...new Set(S.cobrancas.map(c => c.competencia))].sort().reverse();
  return `
  <div class="spread wrap"><h1>Cobranças</h1>
    <button class="btn" data-act="fechamento">${rotuloFechar()}</button></div>
  <div class="card pad">
    <div class="row wrap" style="gap:10px">
      <div class="field" style="margin:0;min-width:150px"><label for="fc">Competência</label>
        <select id="fc" data-act="filtro" data-k="competencia">${comps.map(c => `<option value="${c}" ${c === comp ? "selected" : ""}>${compLabel(c)}</option>`).join("")}</select></div>
      <div class="field" style="margin:0;min-width:160px"><label for="fs">Status</label>
        <select id="fs" data-act="filtro" data-k="status"><option value="">Todos</option>
          ${["pendente", "analise", "parcial", "pago", "atrasado", "cancelado"].map(s => `<option value="${s}" ${f.status === s ? "selected" : ""}>${ROTULO[s]}</option>`).join("")}</select></div>
      <div class="field grow" style="margin:0;min-width:180px"><label for="fb">Inquilino, imóvel ou proprietário</label>
        <input id="fb" value="${esc(f.busca || "")}" data-act="filtro" data-k="busca" placeholder="Buscar"></div>
    </div>
  </div>
  ${cs.length === 0 ? `<div class="emptybox">Nenhuma cobrança com esses filtros. Ajuste a competência ou o status.</div>` : `
  <div class="tablewrap"><table>
    <thead><tr><th>Inquilino</th><th>Imóvel</th><th>Proprietário</th><th>Vence</th><th class="num">Total</th><th class="num">Imobiliária</th><th class="num">Proprietário</th><th>Status</th><th></th></tr></thead>
    <tbody>${cs.map(c => {
      const l = locacao(c.locacaoId), t = totais(c);
      return `<tr><td style="font-weight:600">${esc(pessoa(l.inquilinoId).nome)}</td>
        <td class="muted">${esc(imovel(l.imovelId).apelido)}</td>
        <td class="muted">${esc(pessoa(l.proprietarioId).nome)}</td>
        <td>${dBR(c.vencimento)}</td>
        <td class="num money">${money(t.geral)}</td>
        <td class="num money">${money(t.saldoImobiliaria)}<div class="tiny muted">${statusRecebedor(c, "imobiliaria") === "pago" ? "quitado" : "em aberto"}</div></td>
        <td class="num money">${money(t.saldoProprietario)}<div class="tiny muted">${statusRecebedor(c, "proprietario") === "pago" ? "quitado" : "em aberto"}</div></td>
        <td>${tagHTML(statusGeral(c))}</td>
        <td><div class="row" style="gap:6px"><button class="btn sm" data-act="abrirLocacao" data-id="${l.id}" data-cob="${c.id}">Abrir</button>
        ${pode("financeiro") ? `<button class="btn sm" data-act="avisarZap" data-id="${c.id}" data-tipo="${statusGeral(c) === "atrasado" ? "cobranca" : "aviso"}">${statusGeral(c) === "atrasado" ? "Cobrar" : "Avisar"}</button>` : ""}</div></td></tr>`;
    }).join("")}</tbody></table></div>`}`;
}

function admLocacoes() {
  return `<div class="spread wrap"><h1>Locações</h1>
    <div class="row wrap" style="gap:8px">
      ${pode("locacoes") ? `<button class="btn" data-act="importarLoc">Importar planilha</button>
      <button class="btn primary" data-act="novaLocacao">Nova locação</button>` : ""}
    </div></div>
  <div class="stack">${S.locacoes.map(l => {
    const c = S.cobrancas.find(c => c.locacaoId === l.id && c.competencia === S.competencia);
    return `<button class="card pad" style="text-align:left;cursor:pointer;display:flex;gap:14px;align-items:center" data-act="abrirLocacao" data-id="${l.id}">
      <span class="avatar" style="width:38px;height:38px;font-size:.82rem">${iniciais(pessoa(l.inquilinoId).nome)}</span>
      <span class="grow"><span style="font-weight:600;display:block">${esc(imovel(l.imovelId).apelido)}</span>
      <span class="small muted">${esc(pessoa(l.inquilinoId).nome)} · proprietário ${esc(pessoa(l.proprietarioId).nome)} · vence dia ${l.diaVenc}</span></span>
      ${c ? tagHTML(statusGeral(c)) : `<span class="tag pendente"><span class="dot"></span>Sem cobrança</span>`}
    </button>`;
  }).join("")}</div>`;
}

/* ---- ficha da locação ---- */
function admLocacao() {
  const l = locacao(S.ui.locacaoId); if (!l) return `<div class="emptybox">Locação não encontrada.</div>`;
  const im = imovel(l.imovelId), inq = pessoa(l.inquilinoId), prop = pessoa(l.proprietarioId);
  const cAtual = (S.ui.cobrancaId && S.cobrancas.find(c => c.id === S.ui.cobrancaId && c.locacaoId === l.id))
    || S.cobrancas.find(c => c.locacaoId === l.id && c.competencia === S.competencia)
    || S.cobrancas.filter(c => c.locacaoId === l.id).sort((a, b) => b.competencia.localeCompare(a.competencia))[0];
  const tab = S.ui.tab || "resumo";
  const t = cAtual ? totais(cAtual) : null;
  const btn = (id, lab) => `<button class="${tab === id ? "on" : ""}" data-act="tab" data-tab="${id}">${lab}</button>`;
  let body = "";
  if (tab === "resumo") body = fichaResumo(l, cAtual);
  else if (tab === "cobrancas") body = fichaCobrancas(l);
  else if (tab === "pagamentos") body = fichaPagamentos(l);
  else if (tab === "documentos") body = fichaDocumentos(l);
  else if (tab === "historico") body = fichaHistorico(l);

  return `<button class="btn ghost" style="align-self:flex-start;padding-left:0" data-act="ir" data-view="adm.cobrancas">‹ Voltar às cobranças</button>
  <div class="card pad stack">
    <div class="spread wrap">
      <div><h1>${esc(im.apelido)}</h1><p class="muted small" style="margin:2px 0 0">${esc(im.endereco)}</p></div>
      <div class="row wrap" style="gap:8px">${cAtual ? tagHTML(statusGeral(cAtual)) : ""}
        ${pode("locacoes") ? `<button class="btn sm" data-act="editarLocacao" data-id="${l.id}">Editar locação</button>` : ""}
        ${pode("verComo") ? `<button class="btn sm" data-act="verComo" data-id="${l.inquilinoId}" data-perfil="inquilino">Ver como inquilino</button>
        <button class="btn sm" data-act="verComo" data-id="${l.proprietarioId}" data-perfil="proprietario">Ver como proprietário</button>` : ""}</div>
    </div>
    <div class="grid2 small">
      <div><span class="muted">Inquilino</span><div style="font-weight:600">${esc(inq.nome)}</div><div class="muted">${esc(inq.tel)} · canal preferencial: ${esc(inq.canal)}</div></div>
      <div><span class="muted">Proprietário</span><div style="font-weight:600">${esc(prop.nome)}</div><div class="muted">${esc(prop.tel)} · canal preferencial: ${esc(prop.canal)}</div></div>
      <div><span class="muted">Contrato</span><div>${dBR(l.inicio)} a ${dBR(l.fim)} · vencimento dia ${l.diaVenc}</div></div>
      <div><span class="muted">Multa e juros</span><div>${esc(l.multa)}</div></div>
      <div style="grid-column:1/-1"><span class="muted">Proprietário recebe por</span><div>${esc(resumoRecebimento(recebimentoDe(l.id, "proprietario")))}</div></div>
    </div>
    <div class="row wrap" style="gap:8px">
      ${pode("financeiro") ? `<button class="btn sm" data-act="anexarComprovante" data-id="${cAtual ? cAtual.id : ""}">Anexar comprovante</button>` : ""}
      ${pode("financeiro") ? `<button class="btn sm" data-act="adicionarDocumento" data-id="${l.id}">Adicionar documento</button>` : ""}
      ${cAtual && pode("financeiro") ? `<button class="btn sm" data-act="avisarZap" data-id="${cAtual.id}" data-tipo="aviso">Avisar no WhatsApp</button>
      ${["atrasado", "parcial"].indexOf(statusGeral(cAtual)) >= 0 ? `<button class="btn sm" data-act="avisarZap" data-id="${cAtual.id}" data-tipo="cobranca">Cobrar atraso</button>` : ""}` : ""}
      ${pode("mensagens") ? `<button class="btn sm" data-act="registrarAtendimento" data-id="${l.id}">Registrar atendimento</button>` : ""}
      ${pode("locacoes") ? `<button class="btn sm" data-act="novaCompetencia" data-id="${l.id}">Outra competência</button>` : ""}
    </div>
    <p class="tiny muted" style="margin:0">Tudo que o inquilino e o proprietário fazem no portal pode ser feito aqui por você, com registro da origem da informação.</p>
  </div>
  <div class="tabs">${btn("resumo", "Resumo")}${btn("cobrancas", "Cobranças")}${btn("pagamentos", "Pagamentos")}${btn("documentos", "Documentos")}${btn("historico", "Histórico")}</div>
  ${body}`;
}

function itensHTML(c, opts) {
  opts = opts || {};
  const grupo = rec => {
    const its = c.itens.filter(i => i.recebedor === rec);
    if (!its.length) return "";
    const soma = its.reduce((a, i) => a + Number(i.valor), 0);
    const l = locacao(c.locacaoId);
    const st = statusRecebedor(c, rec);
    return `<div class="lane ${rec === "proprietario" ? "prop" : ""}">
      <div class="spread" style="align-items:flex-start">
        <div><div class="who">Pagar ${rec === "imobiliaria" ? "à imobiliária" : "ao proprietário"}</div>
          <div class="small muted">${esc(rec === "imobiliaria" ? S.imobiliaria.nome : pessoa(l.proprietarioId).nome)}</div></div>
        ${tagHTML(st)}
      </div>
      <div style="margin-top:8px">${its.map(i => {
        let b = i.boletoId ? docPorId(i.boletoId) : null;
        if (b && S.ui.perfil === "inquilino" && b.visivelInquilino === false) b = null;
        return `<div class="itemline"><div class="grow">
          <div style="font-weight:500">${esc(i.desc)}</div>
          ${b ? `<div class="tiny muted">Boleto ${esc(b.nome.length > 34 ? b.nome.slice(0, 31) + "…" : b.nome)} · vence ${dBR(b.vencimento)}</div>
            <div class="row wrap" style="gap:6px;margin-top:6px"><button class="btn sm" data-act="verBoleto" data-id="${b.id}">Ver boleto</button>
            <button class="btn sm" data-act="imprimirBoleto" data-id="${b.id}">Salvar em PDF</button>
            ${S.ui.perfil === "imobiliaria" && b.visivelInquilino === false ? `<button class="btn sm primary" data-act="liberarBoleto" data-id="${b.id}">Liberar ao inquilino</button>` : ""}</div>
            ${S.ui.perfil === "imobiliaria" && b.visivelInquilino === false ? `<div class="tiny" style="color:var(--warn);margin-top:5px">Ainda não visível para o inquilino.</div>` : ""}` : ""}
        </div><div class="money" style="font-weight:600${Number(i.valor) < 0 ? ";color:var(--ok)" : ""}">${money(i.valor)}</div></div>`;
      }).join("")}</div>
      <div class="spread" style="margin-top:10px;padding-top:9px;border-top:1px solid var(--line)">
        <span class="small muted">Subtotal</span><span class="money" style="font-weight:700">${money(soma)}</span>
      </div>
      ${opts.pix && st !== "pago" ? (() => {
        const r = recebimentoDe(c.locacaoId, rec);
        let bloco;
        if (r.forma === "PIX") {
          bloco = `<div class="pixbox" style="margin-top:10px"><span class="muted tiny">PIX ${esc(r.chaveTipo || "")}</span><code>${esc(r.chave || "não informada")}</code>
            <button class="btn sm" data-act="copiarPix" data-v="${esc(r.chave || "")}">Copiar</button></div>`;
        } else if (r.forma === "TED ou depósito") {
          bloco = `<div class="lane" style="margin-top:10px;background:var(--surface-2);border-left-color:var(--${rec === "proprietario" ? "prop" : "brand"})">
            <div class="tiny muted">Transferência ou depósito</div>
            <div class="small" style="margin-top:4px">${esc(r.banco || "Banco não informado")}${r.agencia ? " · ag " + esc(r.agencia) : ""}${r.conta ? " · conta " + esc(r.conta) : ""}${r.tipoConta ? " (" + esc(r.tipoConta) + ")" : ""}</div>
            <div class="small">${esc(r.titular || "")}${r.docTitular ? " · " + esc(r.docTitular) : ""}</div>
            <button class="btn sm" style="margin-top:8px" data-act="copiarPix" data-v="${esc(resumoRecebimento(r))}">Copiar dados</button></div>`;
        } else {
          bloco = `<div class="lane" style="margin-top:10px;background:var(--surface-2)"><div class="small">Este valor é pago na ${esc(S.imobiliaria.nome)}, que repassa ao proprietário.</div></div>`;
        }
        return bloco + `<button class="btn sm block primary" style="margin-top:8px" data-act="enviarComprovante" data-id="${c.id}" data-rec="${rec}">Enviar comprovante deste pagamento</button>`;
      })() : ""}
    </div>`;
  };
  return `<div class="stack" style="gap:12px">${grupo("imobiliaria")}${grupo("proprietario")}</div>`;
}

function fichaResumo(l, c) {
  marca("ciclo");
  if (!c) return `<div class="emptybox">Sem cobrança para ${compNome(S.competencia)}. Crie o fechamento da competência para gerar.</div>`;
  const t = totais(c);
  const todas = S.cobrancas.filter(x => x.locacaoId === c.locacaoId).sort((a, b) => b.competencia.localeCompare(a.competencia));
  return `<div class="card pad stack">
    <div class="spread wrap"><h2>Cobrança de ${compNome(c.competencia)}</h2>
      <span class="small muted">vence ${dBR(c.vencimento)}</span></div>
    ${pode("financeiro") ? `<div class="row wrap" style="gap:8px">
      <button class="btn sm primary" data-act="registrarPagamento" data-id="${c.id}">Registrar pagamento</button>
      <button class="btn sm" data-act="editarItens" data-id="${c.id}">Editar itens</button>
      <button class="btn sm" data-act="proporcional" data-id="${c.id}">Calcular proporcional</button>
      <button class="btn sm" data-act="adicionarConta" data-id="${c.id}">Adicionar conta</button>
      <button class="btn sm" data-act="reciboDaCobranca" data-id="${c.id}">Ver recibo</button>
      <button class="btn sm" data-act="demonstrativoDaCobranca" data-id="${c.id}">Demonstrativo</button>
    </div>` : ""}
    ${todas.length > 1 ? `<div class="row wrap" style="gap:6px">
      <span class="tiny muted" style="align-self:center">Mês:</span>
      ${todas.slice(0, 8).map(o => `<button class="btn sm ${o.id === c.id ? "primary" : ""}" data-act="abrirCompetencia" data-loc="${o.locacaoId}" data-id="${o.id}">${compLabel(o.competencia)}</button>`).join("")}
      ${pode("locacoes") ? `<button class="btn sm" data-act="novaCompetencia" data-id="${c.locacaoId}">+ mês</button>` : ""}
    </div>` : `<div class="row wrap" style="gap:6px"><span class="tiny muted" style="align-self:center">Só existe esta competência.</span>
      ${pode("locacoes") ? `<button class="btn sm" data-act="novaCompetencia" data-id="${c.locacaoId}">Gerar outro mês</button>` : ""}</div>`}
    ${c.competencia !== S.competencia ? `<div class="lane" style="border-left-color:var(--warn);background:var(--warn-soft)"><div class="small">Você está vendo a competência de ${compNome(c.competencia)}. As ações acima valem para ela.</div></div>` : ""}
    ${c.itens.some(i => i.variavel) ? `<div class="lane" style="border-left-color:var(--${c.itens.some(i => i.variavel && Number(i.valor) === 0) ? "warn" : "brand"});background:var(--surface-2)">
      <div class="small" style="font-weight:500">Despesas que mudam todo mês</div>
      <div class="small muted" style="margin:4px 0 8px">${c.itens.filter(i => i.variavel).map(i => esc(i.desc) + ": " + (Number(i.valor) ? money(i.valor) : "a lançar")).join(" · ")}</div>
      ${pode("financeiro") ? `<button class="btn sm primary" data-act="lancarVariaveis" data-id="${c.id}">Lançar valores do mês</button>` : ""}
    </div>` : ""}
    ${itensHTML(c)}
    <div class="spread" style="border-top:1px solid var(--line);padding-top:12px">
      <strong>Total da competência</strong><strong class="money" style="font-size:1.1rem">${money(t.geral)}</strong>
    </div>
  </div>`;
}

function fichaCobrancas(l) {
  const cs = S.cobrancas.filter(c => c.locacaoId === l.id).sort((a, b) => b.competencia.localeCompare(a.competencia));
  const sel = (S.ui.cobrancaId && cs.find(c => c.id === S.ui.cobrancaId)) || null;
  return `<div class="card pad stack">
    <div class="spread wrap"><h2>Todas as cobranças</h2>
      ${pode("locacoes") ? `<button class="btn sm" data-act="novaCompetencia" data-id="${l.id}">Gerar outra competência</button>` : ""}</div>
    <p class="small muted" style="margin:0">Abra qualquer mês para registrar pagamento retroativo, corrigir itens ou anexar um comprovante antigo.</p>
    ${cs.map(c => { const t = totais(c); const r = S.recibos.find(x => x.cobrancaId === c.id); return `
    <div class="spread wrap" style="border-bottom:1px solid var(--line);padding-bottom:10px${sel && sel.id === c.id ? ";background:var(--surface-2);border-radius:var(--r-sm);padding:8px" : ""}">
      <div><div style="font-weight:500">${compNome(c.competencia)}</div>
        <div class="small muted">vence ${dBR(c.vencimento)} · ${c.itens.length} itens · pago ${money(t.pagoGeral)} de ${money(t.geral)}${r ? " · recibo " + esc(r.numero) : ""}</div></div>
      <div class="row" style="gap:8px">
        <div style="text-align:right"><div class="money" style="font-weight:500">${money(t.saldoGeral)}</div>${tagHTML(statusGeral(c))}</div>
        <button class="btn sm ${sel && sel.id === c.id ? "" : "primary"}" data-act="abrirCompetencia" data-loc="${l.id}" data-id="${c.id}">${sel && sel.id === c.id ? "Aberta" : "Abrir"}</button>
      </div></div>`; }).join("")}
  </div>`;
}

function fichaPagamentos(l) {
  const ps = S.pagamentos.filter(p => p.locacaoId === l.id).sort((a, b) => b.data.localeCompare(a.data));
  if (!ps.length) return `<div class="emptybox">Nenhum pagamento registrado ainda nesta locação.</div>`;
  return `<div class="card pad stack"><h2>Pagamentos</h2>${ps.map(p => `
    <div class="spread" style="border-bottom:1px solid var(--line);padding-bottom:10px">
      <div><div style="font-weight:600">${money(p.valor)} · ${p.recebedor === "imobiliaria" ? "imobiliária" : "proprietário"}</div>
      <div class="small muted">${dBR(p.data)} · ${esc(detalheRepasse(p, p.locacaoId))} · origem ${esc(p.origem)} · ${compLabel(p.competencia)}</div>
      ${p.obs ? `<div class="tiny muted">${esc(p.obs)}</div>` : ""}</div>
      <div style="text-align:right">${p.comprovanteId ? `<button class="btn sm" data-act="verComprovante" data-id="${p.comprovanteId}">Comprovante</button>` : `<span class="tiny muted">sem comprovante</span>`}
      <div class="tiny muted" style="margin-top:4px">por ${esc(p.registradoPor)}</div></div>
    </div>`).join("")}</div>`;
}

function fichaDocumentos(l) {
  const docs = S.documentos.filter(d => d.locacaoId === l.id);
  const cps = S.comprovantes.filter(c => c.locacaoId === l.id);
  const recs = S.recibos.filter(r => r.locacaoId === l.id);
  const cat = (titulo, arr, render) => arr.length ? `<div class="stack" style="gap:8px"><h3>${titulo}</h3><div class="filelist">${arr.map(render).join("")}</div></div>` : "";
  const fileRow = (nome, sub, acao, id, ico) => `<div class="file"><span class="ico">${ico}</span><span class="grow"><span style="font-weight:500" class="truncate">${esc(nome)}</span>
    <span class="small muted" style="display:block">${sub}</span></span>${acao ? `<button class="btn sm" data-act="${acao}" data-id="${id}">Abrir</button>` : ""}</div>`;
  return `<div class="card pad stack">
    <div class="spread"><h2>Central de documentos</h2><button class="btn sm" data-act="adicionarDocumento" data-id="${l.id}">Adicionar documento</button></div>
    ${l.contratoUrl ? `<div class="stack" style="gap:8px"><h3>Contrato no Drive</h3>
      <div class="file"><span class="ico">LINK</span><span class="grow"><span style="font-weight:500">Contrato da locação</span>
      <span class="small muted" style="display:block">Arquivo que já estava no Drive da Altha, vinculado a esta locação</span></span>
      <a class="btn sm" href="${esc(l.contratoUrl)}" target="_blank" rel="noopener">Abrir</a></div></div>` : ""}
    ${cat("Contratos e aditivos", docs.filter(d => d.tipo === "Contrato" || d.tipo === "Aditivo"), d => fileRow(d.nome, `${esc(d.tipo)} · ${dBR(d.criadoEm)}`, null, d.id, "PDF"))}
    ${cat("Contas e boletos", docs.filter(d => ehConta(d)), d => fileRow(d.nome, `${esc(nomeConta(d))} · ${compLabel(d.competencia)} · ${money(d.valor)} · origem ${esc(d.origem)}`, "verBoleto", d.id, "PDF"))}
    ${cat("Comprovantes", cps, c => fileRow(c.nome, `${compLabel(c.competencia)} · ${c.recebedor === "imobiliaria" ? "imobiliária" : "proprietário"} · ${esc(c.origem)} · ${c.status === "em_analise" ? "em análise" : c.status === "aprovado" ? "validado" : "recusado"}`, "verComprovante", c.id, c.mime && c.mime.startsWith("image") ? "IMG" : "PDF"))}
    ${cat("Recibos", recs, r => fileRow(r.nome, `${compLabel(r.competencia)} · ${money(r.valor)} · emitido ${dBR(r.em)}`, "verRecibo", r.id, "PDF"))}
    ${cat("Outros documentos", docs.filter(d => ["Vistoria", "Lavanderia", "Diversos"].includes(d.tipo)), d => fileRow(d.nome, `${esc(d.tipo)} · ${dBR(d.criadoEm)}`, null, d.id, "PDF"))}

function admDrive() {

  return `<div class="spread wrap"><h1>Google Drive</h1>

    <p class="tiny muted" style="margin:0">Você vincula só a pasta da locação. As subpastas abaixo são o caminho que o sistema monta sozinho — servem para conferir se bate com o seu Drive e ver o que já foi capturado.</p>

  </div>

    return `<div class="card pad stack" style="gap:12px">
      <div class="spread wrap">
        <div><div style="font-weight:500">${esc(base)}</div>

        ${l.driveUrl ? `<a class="btn sm" href="${esc(l.driveUrl)}" target="_blank" rel="noopener">Abrir no Drive</a>`

      </div>
      <div class="stack" style="gap:10px;border-left:2px solid var(--line);padding-left:14px">
        ${caminhos.map(c => {
          const dentro = meus.filter(f => f.path === c.p || (f.tipo === c.k && (c.rec === null || f.recebedor === c.rec) && !f.path));
          const rotulo = c.p.startsWith(base) ? c.p.slice(base.length).replace(/^ \/ /, "") : c.p;
          return `<div>
            <div class="spread"><span class="small" style="font-weight:500">${esc(rotulo)}</span>

            ${dentro.length ? `<div class="filelist" style="margin-top:6px">${dentro.map(f => `<div class="file" style="padding:7px 9px">
              <span class="ico" style="width:24px;height:28px">${/\.(jpg|jpeg|png)$/i.test(f.nome) ? "IMG" : "PDF"}</span>
              <span class="grow"><span class="truncate small" style="font-weight:500">${esc(f.nome)}</span>
              <span class="tiny muted" style="display:block">sincronizado ${dHora(f.em)}</span></span></div>`).join("")}</div>` : ""}

function admRelatorios() {
  const comps = [...new Set(S.cobrancas.map(c => c.competencia))].sort().reverse();
  const comp = comps.indexOf(S.ui.relComp) >= 0 ? S.ui.relComp : (comps[0] || S.competencia);
  const pgs = S.pagamentos.filter(p => p.competencia === comp).sort((a, b) => a.data.localeCompare(b.data));
  const cs = S.cobrancas.filter(c => c.competencia === comp && !c.cancelada);
  let previsto = 0, recebido = 0, imob = 0, prop = 0;
  cs.forEach(c => { const t = totais(c); previsto += t.geral; recebido += t.pagoGeral; });
  pgs.forEach(p => { if (p.recebedor === "imobiliaria") imob += p.valor; else prop += p.valor; });
  const porProp = {};
  pgs.filter(p => p.recebedor === "proprietario").forEach(p => {
    const l = locacao(p.locacaoId); const k = l ? l.proprietarioId : "—";
    porProp[k] = (porProp[k] || 0) + p.valor;
  });
  const porForma = {};
  pgs.forEach(p => { porForma[p.forma] = (porForma[p.forma] || 0) + p.valor; });
  const kpi = (lab, val, sub) => `<div class="kpi"><div class="small muted">${lab}</div><div class="v money">${money(val)}</div>${sub ? `<div class="tiny muted">${sub}</div>` : ""}</div>`;
  return `<div class="spread wrap"><h1>Relatórios</h1>
    <button class="btn primary" data-act="exportarPagamentos" data-c="${comp}">Gerar relatório em Excel</button></div>
  <div class="card pad stack" style="gap:10px">

  </div>
  <div class="kpis">
    ${kpi("Previsto", previsto, cs.length + " cobranças")}
    ${kpi("Recebido", recebido, pgs.length + " pagamentos")}
    ${kpi("Ficou com a Altha", imob)}
    ${kpi("Repassado aos proprietários", prop)}
  </div>
  <div class="card pad stack">
    <h2>Por proprietário</h2>
    ${Object.keys(porProp).length ? Object.keys(porProp).map(k => `<div class="spread" style="border-bottom:1px solid var(--line);padding-bottom:8px">
      <span>${esc(pessoa(k).nome)}</span><span class="money" style="font-weight:500">${money(porProp[k])}</span></div>`).join("")
      : `<div class="emptybox small">Nenhum repasse nesta competência.</div>`}
  </div>
  <div class="card pad stack">
    <h2>Por forma de pagamento</h2>
    ${Object.keys(porForma).length ? Object.keys(porForma).map(k => `<div class="spread small" style="border-bottom:1px solid var(--line);padding-bottom:8px">
      <span class="muted">${esc(k)}</span><span class="money">${money(porForma[k])}</span></div>`).join("")
      : `<div class="emptybox small">Sem pagamentos.</div>`}
  </div>
  <div class="card pad stack">
    <h2>Pagamentos do mês</h2>
    ${pgs.length ? `<div class="tablewrap"><table>
      <thead><tr><th>Data</th><th>Inquilino</th><th>Imóvel</th><th>Para quem</th><th>Forma e repasse</th><th class="num">Valor</th></tr></thead>
      <tbody>${pgs.map(p => {
        const l = locacao(p.locacaoId) || {};
        return `<tr><td>${dBR(p.data)}</td><td>${esc(l.inquilinoId ? pessoa(l.inquilinoId).nome : "—")}</td>
          <td class="muted">${esc(l.imovelId ? imovel(l.imovelId).apelido : "—")}</td>

          <td class="num money">${money(p.valor)}</td></tr>`;
      }).join("")}</tbody></table></div>` : `<div class="emptybox">Nenhum pagamento registrado nesta competência.</div>`}
  </div>`;
}

function naoLidas() {
  return minhasMensagens().filter(m => m.encaminhadaPara === S.ui.perfil && !m.lidaEm).length;
}
function marcaLidas() {
  let mudou = false;
  minhasMensagens().forEach(m => { if (m.encaminhadaPara === S.ui.perfil && !m.lidaEm) { m.lidaEm = agora(); mudou = true; } });
  if (mudou) save();
}
function avisoRecados() {
  const ms = minhasMensagens().filter(m => m.encaminhadaPara === S.ui.perfil && !m.lidaEm);

function inqCobrancas() { return cobrancasDoInquilino(S.ui.pessoaId).filter(c => !c.cancelada).sort((a, b) => b.competencia.localeCompare(a.competencia)); }
function inqCobrancaAtual(ignoraSelecao) {
  const cs = inqCobrancas();
  if (!ignoraSelecao) { const sel = cs.find(c => c.id === S.ui.cobrancaId); if (sel) return sel; }
  const abertas = cs.filter(c => statusGeral(c) !== "pago");
  return abertas.sort((a, b) => a.vencimento.localeCompare(b.vencimento))[0] || cs[0];
}

function inqLocacoes() { return S.locacoes.filter(l => l.inquilinoId === S.ui.pessoaId); }
const imNome = id => imovel((locacao(id) || {}).imovelId).apelido;

  marca("multiLocacao");
  const me = pessoa(S.ui.pessoaId);
  const locs = inqLocacoes();
  const cs = inqCobrancas();
  const abertas = cs.filter(c => statusGeral(c) !== "pago");
  const devendo = abertas.reduce((a, c) => a + totais(c).saldoGeral, 0);
  const partes = money(devendo).split(",");
  return `${avisoRecados()}
  <div>
    <h1 style="letter-spacing:-.02em">Olá, ${esc(me.nome.split(" ")[0])}</h1>

      <div class="spread" style="align-items:flex-start">
        <div><div style="font-weight:500">${esc(imovel(l.imovelId).apelido)}</div>

        ${tagHTML(st)}

      <div class="spread"><span class="small muted">${st === "pago" ? "Total pago" : "Em aberto"}</span>
        <span class="money" style="font-size:1.15rem;font-weight:500">${money(st === "pago" ? t.geral : t.saldoGeral)}</span></div>
      <div class="small muted">${st === "pago" ? `Quitado nos dois recebedores${S.recibos.some(r => r.cobrancaId === c.id) ? " · recibo emitido" : ""}` : `${esc(S.imobiliaria.nome)}: ${money(t.saldoImobiliaria)} · ${esc(pessoa(l.proprietarioId).nome.split(" ")[0])}: ${money(t.saldoProprietario)}`}</div>
      <div class="row even" style="gap:8px">
        <button class="btn grow ${st === "pago" ? "" : "primary"}" data-act="verCompetencia" data-id="${c.id}">Ver cobrança</button>

    <div class="amount-hero money">${partes[0]}<span class="cents">,${partes[1]}</span></div>
    <div class="row wrap" style="gap:8px;margin-bottom:12px">${tagHTML(st)}<span class="small muted">vence ${dBR(c.vencimento)}</span></div>
    <div class="lane ${aviso.cls === "atrasado" ? "" : ""}" style="border-left-color:var(--${aviso.cls === "pago" ? "ok" : aviso.cls === "atrasado" ? "bad" : aviso.cls === "parcial" ? "warn" : "brand"});background:var(--surface-2)">
      <div class="small">${aviso.txt}</div>
    </div>
    <div class="stack" style="gap:8px;margin-top:14px">
      <button class="btn primary block" data-act="ir" data-view="inq.cobranca">Ver cobrança</button>
      <div class="row even" style="gap:8px">
        <button class="btn grow" data-act="enviarComprovante" data-id="${c.id}">Enviar comprovante</button>
        <button class="btn grow" data-act="ir" data-view="inq.docs">Documentos</button>
      </div>
      <button class="btn block" data-act="falarImob">Falar com a imobiliária</button>
      ${botaoZap()}
    </div>
  </div>
  ${(() => {
    const outras = inqCobrancas().filter(x => x.id !== c.id && statusGeral(x) !== "pago");
    if (!outras.length) return "";
    return `<div class="card pad stack" style="gap:10px"><h3>Outras cobranças em aberto</h3>
      ${outras.map(o => `<button class="spread" style="background:none;border:0;padding:6px 0;cursor:pointer;width:100%" data-act="verCompetencia" data-id="${o.id}">
        <span class="small">${inqLocacoes().length > 1 ? esc(imNome(o.locacaoId)) + " · " : ""}${compNome(o.competencia)}</span>
        <span class="row" style="gap:8px"><span class="money small">${money(totais(o).saldoGeral)}</span>${tagHTML(statusGeral(o))}<span style="color:var(--brand)">›</span></span></button>`).join("")}
    </div>`;
  })()}
  <div class="card pad stack" style="gap:10px">
    <h3>Para quem você paga</h3>
    <div class="spread small"><span>${esc(S.imobiliaria.nome)}</span><span class="row" style="gap:8px"><span class="money">${money(t.saldoImobiliaria)}</span>${tagHTML(statusRecebedor(c, "imobiliaria"))}</span></div>
    <div class="spread small"><span>${esc(pessoa(l.proprietarioId).nome)}</span><span class="row" style="gap:8px"><span class="money">${money(t.saldoProprietario)}</span>${tagHTML(statusRecebedor(c, "proprietario"))}</span></div>
    <p class="tiny muted" style="margin:0">São dois pagamentos diferentes. Confira a chave PIX de cada um antes de pagar.</p>
  </div>`;
}

function inqCobranca() {
  const c = inqCobrancaAtual(); if (!c) return `<div class="emptybox">Nenhuma cobrança disponível.</div>`;
  marca("cobrancaInquilino");
  const l = locacao(c.locacaoId), t = totais(c);
  const outras = inqCobrancas().filter(x => x.id !== c.id);
  return `<div class="spread"><div><h1>Cobrança de ${compNome(c.competencia)}</h1>
    <p class="muted small" style="margin:2px 0 0">${esc(imovel(l.imovelId).apelido)} · vence ${dBR(c.vencimento)}</p></div>${tagHTML(statusGeral(c))}</div>
  <div class="card pad stack">
    <div class="spread"><span class="muted small">Total da competência</span><strong class="money" style="font-size:1.15rem">${money(t.geral)}</strong></div>
    ${itensHTML(c, { pix: true })}
  </div>
  ${outras.length ? `<div class="card pad stack" style="gap:10px"><h3>${inqLocacoes().length > 1 ? "Outras cobranças" : "Outras competências"}</h3>
    ${outras.map(o => `<button class="spread small" style="background:none;border:0;padding:6px 0;cursor:pointer;width:100%;text-align:left" data-act="verCompetencia" data-id="${o.id}">
      <span>${inqLocacoes().length > 1 ? esc(imNome(o.locacaoId)) + " · " : ""}${compNome(o.competencia)}</span><span class="row" style="gap:8px"><span class="money">${money(totais(o).geral)}</span>${tagHTML(statusGeral(o))}<span style="color:var(--brand)">›</span></span></button>`).join("")}</div>` : ""}`;
}

function inqDocumentos() {
  const multi = inqLocacoes().length > 1;
  const pre = id => multi ? esc(imNome(id)) + " · " : "";
  const locs = inqLocacoes().map(l => l.id);
  const docs = S.documentos.filter(d => locs.includes(d.locacaoId) && d.visivelInquilino !== false);
  const recs = S.recibos.filter(r => locs.includes(r.locacaoId));
  const cps = S.comprovantes.filter(c => locs.includes(c.locacaoId));
  const bloco = (titulo, arr, render) => `<div class="card pad stack" style="gap:10px"><h3>${titulo}</h3>${arr.length ? `<div class="filelist">${arr.map(render).join("")}</div>` : `<div class="emptybox small">Nada por aqui ainda.</div>`}</div>`;
  const row = (nome, sub, acao, id, ico) => `<div class="file"><span class="ico">${ico}</span><span class="grow"><span class="truncate" style="font-weight:500">${esc(nome)}</span>
    <span class="small muted" style="display:block">${sub}</span></span>${acao ? `<button class="btn sm" data-act="${acao}" data-id="${id}">Abrir</button>` : ""}</div>`;
  return `<h1>Documentos</h1>
  ${bloco("Recibos", recs, r => row(r.nome, `${pre(r.locacaoId)}${compLabel(r.competencia)} · ${money(r.valor)}`, "verRecibo", r.id, "PDF"))}
  ${bloco("Contas e boletos", docs.filter(d => ehConta(d)), d => row(d.nome, `${pre(d.locacaoId)}${esc(nomeConta(d))} · ${compLabel(d.competencia)} · ${money(d.valor)} · vence ${dBR(d.vencimento)}`, "verBoleto", d.id, "PDF"))}
  ${bloco("Comprovantes enviados", cps, c => row(c.nome, `${pre(c.locacaoId)}${compLabel(c.competencia)} · ${c.recebedor === "imobiliaria" ? "imobiliária" : "proprietário"} · ${c.status === "em_analise" ? "em análise" : c.status === "aprovado" ? "aprovado" : "recusado"}`, "verComprovante", c.id, c.mime && c.mime.startsWith("image") ? "IMG" : "PDF"))}
  ${(() => {
    const comLink = S.locacoes.filter(l => l.inquilinoId === S.ui.pessoaId && l.contratoUrl);
    if (!comLink.length) return "";
    return `<div class="card pad stack" style="gap:10px"><h3>Contrato</h3><div class="filelist">${comLink.map(l => `<div class="file"><span class="ico">LINK</span>
      <span class="grow"><span style="font-weight:500">Contrato · ${esc(imovel(l.imovelId).apelido)}</span>
      <span class="small muted" style="display:block">Disponibilizado pela Altha Imóveis</span></span>
      <a class="btn sm" href="${esc(l.contratoUrl)}" target="_blank" rel="noopener">Abrir</a></div>`).join("")}</div></div>`;
  })()}
  ${bloco("Contrato e aditivos", docs.filter(d => d.tipo === "Contrato" || d.tipo === "Aditivo"), d => row(d.nome, `${pre(d.locacaoId)}${esc(d.tipo)} · ${dBR(d.criadoEm)}`, null, d.id, "PDF"))}
  ${bloco("Outros documentos", docs.filter(d => ["Vistoria", "Lavanderia", "Diversos"].indexOf(d.tipo) >= 0), d => row(d.nome, `${pre(d.locacaoId)}${esc(d.tipo)} · ${dBR(d.criadoEm)}`, null, d.id, "PDF"))}`;
}

function minhasMensagens() {
  const locs = (S.ui.perfil === "inquilino" ? inqLocacoes() : locacoesDoProprietario(S.ui.pessoaId)).map(l => l.id);
  return S.mensagens.filter(m => locs.includes(m.locacaoId) && (m.perfilDe === S.ui.perfil || m.encaminhadaPara === S.ui.perfil))
    .sort((a, b) => b.em.localeCompare(a.em));
}
function zapAltha(texto) { return "https://wa.me/55" + soDigitos(S.imobiliaria.tel) + "?text=" + encodeURIComponent(texto || ""); }
function botaoZap(rotulo) {
  const eu = S.ui.pessoaId ? pessoa(S.ui.pessoaId).nome : "";
  const locs = S.ui.perfil === "inquilino" ? inqLocacoes() : locacoesDoProprietario(S.ui.pessoaId);
  const im = locs[0] ? imovel(locs[0].imovelId).apelido : "";
  return `<a class="btn block" href="${esc(zapAltha("Olá, aqui é " + eu + (im ? ", do imóvel " + im : "") + ". "))}" target="_blank" rel="noopener">${rotulo || "Chamar a Altha no WhatsApp"}</a>`;
}
function inqMensagens() {
  marcaLidas();
  const ms = minhasMensagens();
  const bolha = (quem, texto, quando, daAltha) => `<div class="lane ${daAltha ? "" : "prop"}" style="border-left-color:var(--${daAltha ? "brand" : "prop"})">
    <div class="tiny muted">${esc(daAltha ? quem : "Você")} · ${dHora(quando)}</div>
    <div class="small" style="margin-top:4px">${esc(texto)}</div></div>`;
  return `<div class="spread"><h1>Mensagens</h1><button class="btn sm primary" data-act="falarImob">Nova</button></div>
  ${ms.length === 0 ? `<div class="emptybox">Nenhuma conversa ainda. Use o botão Nova para falar com a Altha sobre cobrança, contrato, condomínio ou manutenção.</div>` : `
  <div class="stack">${ms.map(m => `<div class="card pad stack" style="gap:10px">
    <div class="spread"><div><div style="font-weight:500">${esc(m.assunto)}</div>
      <div class="small muted">${esc(imNome(m.locacaoId))} · ${m.encaminhadaPara === S.ui.perfil ? "encaminhada pela Altha" : "aberta"} em ${dHora(m.em)}</div></div>
      <span class="tag ${m.status === "Resolvida" || m.status === "Respondida" ? "pago" : m.status === "Nova" ? "analise" : "parcial"}"><span class="dot"></span>${esc(m.status)}</span></div>
    ${m.encaminhadaPara === S.ui.perfil
      ? `<div class="lane" style="border-left-color:var(--brand);background:var(--surface-2)"><div class="tiny muted">A Altha encaminhou para você</div>
         <div class="small" style="margin-top:4px;white-space:pre-line">${esc(m.textoEncaminhado || m.texto)}</div></div>`
      : bolha(m.de, m.texto, m.em, false)}
    ${(m.respostas || []).map(r => bolha(r.de, r.texto, r.em, r.perfil === "imobiliaria")).join("")}
    ${m.status === "Resolvida" ? "" : `<button class="btn sm block" data-act="responderCliente" data-id="${m.id}">Responder</button>`}
  </div>`).join("")}</div>`}
  <div class="card pad stack" style="gap:10px"><h3>Prefere falar por WhatsApp?</h3>
    <p class="small muted" style="margin:0">Você também é atendido pelo número da Altha, e a equipe registra a conversa aqui.</p>
    ${botaoZap()}</div>`;
}

/* ============ portal do proprietário ============ */
function viewProprietario() {
  const v = S.ui.view;
  let body = avisoConexao() + (v === "prop.demonstrativo" ? propDemonstrativo() : v === "prop.docs" ? propDocumentos() : v === "prop.msgs" ? inqMensagens() : propHome());
  return topbar() + `<div class="client-shell stack">${body}</div>` + tabbar([
    { v: "prop.home", l: "Imóveis", i: "imo" }, { v: "prop.demonstrativo", l: "Demonstrativo", i: "pix" },
    { v: "prop.msgs", l: "Mensagens", i: "msg", n: naoLidas() }, { v: "prop.docs", l: "Documentos", i: "doc" }
  ]);
}

function propCobrancas(locId) {
  return S.cobrancas.filter(c => c.locacaoId === locId && !c.cancelada).sort((a, b) => b.competencia.localeCompare(a.competencia));
}
function propHome() {
  const me = pessoa(S.ui.pessoaId);
  const locs = locacoesDoProprietario(S.ui.pessoaId);
  let aberto = 0, recebido = 0, abertas = 0;
  locs.forEach(l => propCobrancas(l.id).forEach(c => {
    const t = totais(c); aberto += t.saldoProprietario; recebido += t.pagoProprietario;
    if (t.saldoProprietario > 0.004) abertas++;
  }));
  const partes = money(aberto).split(",");
  return `<div><h1 style="letter-spacing:-.02em">Olá, ${esc(me.nome.split(" ")[0])}</h1>
    <p class="muted small" style="margin:2px 0 0">${locs.length} ${locs.length === 1 ? "imóvel" : "imóveis"} com a ${esc(S.imobiliaria.nome)}</p></div>
  ${avisoRecados()}
  <div class="card pad">
    <div class="small muted">${aberto > 0.004 ? "A receber, somando todos os meses em aberto" : "Nada em aberto no momento"}</div>
    <div class="amount-hero money" style="font-size:clamp(2rem,9vw,2.6rem)">${partes[0]}<span class="cents">,${partes[1]}</span></div>
    <div class="small muted">${abertas ? `${abertas} ${abertas === 1 ? "cobrança em aberto" : "cobranças em aberto"}` : "Todas as cobranças quitadas."}</div>
    <div class="spread small" style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px">
      <span class="muted">Já recebido pela ${esc(S.imobiliaria.nome)}</span><span class="money" style="font-weight:500">${money(recebido)}</span></div>
    <button class="btn primary block" style="margin-top:14px" data-act="enviarBoleto">Enviar contas do imóvel</button>
    <div style="margin-top:8px"><button class="btn block" data-act="falarImob">Falar com a imobiliária</button></div>
    <div style="margin-top:8px">${botaoZap()}</div>
  </div>
  ${locs.map(l => {
    const cs = propCobrancas(l.id);
    return `<div class="card pad stack" style="gap:10px">
      <div><div style="font-weight:500">${esc(imovel(l.imovelId).apelido)}</div>
        <div class="small muted">${esc(pessoa(l.inquilinoId).nome)} · vence dia ${l.diaVenc}</div></div>
      ${cs.length ? cs.slice(0, 6).map(c => {
        const t = totais(c), st = statusRecebedor(c, "proprietario");
        return `<div class="spread" style="border-top:1px solid var(--line);padding-top:8px">
          <div><div class="small" style="font-weight:500">${compNome(c.competencia)}</div>
            <div class="tiny muted">vence ${dBR(c.vencimento)} · previsto ${money(t.proprietario)}</div></div>
          <div style="text-align:right"><div class="money small" style="font-weight:500">${st === "pago" ? money(t.pagoProprietario) : money(t.saldoProprietario)}</div>
            ${tagHTML(st)}</div></div>`;
      }).join("") : `<div class="small muted">Sem cobranças geradas ainda.</div>`}
      <div class="row even" style="gap:8px">
        <button class="btn sm grow" data-act="demonstrativoDoImovel" data-id="${l.id}">Demonstrativo</button>
        <button class="btn sm grow" data-act="enviarBoleto" data-loc="${l.id}">Enviar conta</button>
      </div>
    </div>`;
  }).join("")}`;
}
function propDemonstrativo() {
  const todas = locacoesDoProprietario(S.ui.pessoaId);
  const sel = S.ui.propLoc && todas.some(l => l.id === S.ui.propLoc) ? S.ui.propLoc : "todos";
  const locs = sel === "todos" ? todas : todas.filter(l => l.id === sel);
  const comps = [...new Set(todas.reduce((a, l) => a.concat(propCobrancas(l.id).map(c => c.competencia)), []))].sort().reverse();
  const comp = comps.indexOf(S.ui.propComp) >= 0 ? S.ui.propComp : (comps[0] || S.competencia);
  const chip = (id, rot) => `<button class="btn sm ${sel === id ? "primary" : ""}" data-act="propFiltro" data-id="${id}">${esc(rot)}</button>`;
  return `<h1>Demonstrativo de ${compNome(comp)}</h1>
  ${comps.length > 1 ? `<div class="row wrap" style="gap:6px"><span class="tiny muted" style="align-self:center">Mês:</span>
    ${comps.map(k => `<button class="btn sm ${k === comp ? "primary" : ""}" data-act="propMes" data-c="${k}">${compLabel(k)}</button>`).join("")}</div>` : ""}
  ${todas.length > 1 ? `<div class="row wrap" style="gap:8px">${chip("todos", "Todos os imóveis")}${todas.map(l => chip(l.id, imovel(l.imovelId).apelido)).join("")}</div>` : ""}
  <div class="card pad stack">
    ${locs.map(l => {
      const c = S.cobrancas.find(c => c.locacaoId === l.id && c.competencia === comp);
      if (!c) return `<div class="small muted">${esc(imovel(l.imovelId).apelido)} — sem cobrança em ${compLabel(comp)}.</div>`;
      const t = totais(c);
      return `<div class="stack" style="gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px">
        <div style="font-weight:600">${esc(imovel(l.imovelId).apelido)}</div>
        ${c.itens.filter(i => i.recebedor === "proprietario").map(i => `<div class="spread small"><span class="muted">${esc(i.desc)}</span><span class="money">${money(i.valor)}</span></div>`).join("")}
        <div class="spread small"><span class="muted">Taxas retidas pela imobiliária</span><span class="money">− ${money(t.imobiliaria)}</span></div>
        <div class="spread"><strong class="small">Recebido até agora</strong><strong class="money">${money(t.pagoProprietario)}</strong></div>
        <div class="spread small"><span class="muted">Em aberto</span><span class="money">${money(t.saldoProprietario)}</span></div>
      </div>`;
    }).join("")}
    <button class="btn block" data-act="verDemonstrativo" data-loc="${sel}">Abrir ${sel === "todos" ? "demonstrativo de todos os imóveis" : "demonstrativo deste imóvel"} em PDF</button>
  </div>`;
}

function propDocumentos() {
  const locs = locacoesDoProprietario(S.ui.pessoaId).map(l => l.id);
  const docs = S.documentos.filter(d => locs.includes(d.locacaoId));
  const recs = S.recibos.filter(r => locs.includes(r.locacaoId));
  const row = (nome, sub, acao, id) => `<div class="file"><span class="ico">PDF</span><span class="grow"><span class="truncate" style="font-weight:500">${esc(nome)}</span>
    <span class="small muted" style="display:block">${sub}</span></span>${acao ? `<button class="btn sm" data-act="${acao}" data-id="${id}">Abrir</button>` : ""}</div>`;
  return `<h1>Documentos</h1>
  <div class="card pad stack" style="gap:10px"><h3>Contas enviadas</h3>
    <div class="filelist">${docs.filter(d => ehConta(d)).map(d => row(d.nome, `${compLabel(d.competencia)} · ${money(d.valor)} · ${esc(d.origem)}`, "verBoleto", d.id)).join("") || `<div class="emptybox small">Nenhuma conta enviada ainda.</div>`}</div>
    <button class="btn block" data-act="enviarBoleto">Enviar conta</button>
  </div>
  <div class="card pad stack" style="gap:10px"><h3>Recibos, contratos e outros</h3>
    <div class="filelist">${[...recs.map(r => row(r.nome, `${compLabel(r.competencia)} · ${money(r.valor)}`, "verRecibo", r.id)),
      ...docs.filter(d => ["Contrato", "Aditivo", "Vistoria", "Lavanderia", "Diversos"].indexOf(d.tipo) >= 0).map(d => row(d.nome, `${esc(d.tipo)} · ${dBR(d.criadoEm)}`, null, d.id))].join("") || `<div class="emptybox small">Nada por aqui ainda.</div>`}</div>
  </div>`;
}

/* ============ documentos gerados ============ */

  return `<div class="doc-paper">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><h3>${!b.conta || b.conta === "Condomínio" ? "Boleto de condomínio" : "Conta de " + esc(b.conta.toLowerCase())}</h3><span style="font-size:.8rem">${compNome(b.competencia)}</span></div>
    <hr class="doc-rule">
    <div class="boleto-line" style="font-weight:600">${esc(b.linhaDigitavel || "34191.79001 01043.510047 91020.150008 8 00000000000000")}</div>
    <hr class="doc-rule">
    <table><tbody>
      <tr><td style="width:45%">Beneficiário</td><td>${b.conta && b.conta !== "Condomínio" ? esc(b.conta) : "Condomínio " + esc(im.apelido.split("—").pop().trim())}</td></tr>
      <tr><td>Imóvel</td><td>${esc(im.apelido)} — ${esc(im.endereco)}</td></tr>

      <tr><td>Origem no sistema</td><td>${esc(b.origem)} · cadastrado por ${esc(b.criadoPor)} em ${dHora(b.criadoEm)}</td></tr>
    </tbody></table>
    <p style="font-size:.78rem;margin-top:14px;font-family:var(--sans);color:#7D746A">Documento de demonstração do piloto. No sistema real este é o arquivo PDF recebido do proprietário ou da administradora, guardado no Google Drive e vinculado à cobrança de ${compLabel(b.competencia)}.</p>
  </div>`;
}

function reciboHTML(r) {
  const c = cobranca(r.cobrancaId), l = locacao(r.locacaoId), im = imovel(l.imovelId);
  const pags = S.pagamentos.filter(p => p.cobrancaId === c.id);
  return `<div class="doc-paper">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><h3>Recibo de pagamento</h3><span style="font-size:.8rem">nº ${esc(r.numero)}</span></div>
    <hr class="doc-rule">
    <p style="margin:0 0 12px">Recebemos de <strong>${esc(pessoa(l.inquilinoId).nome)}</strong> a importância de <strong>${money(r.valor)}</strong>,
    referente à locação do imóvel ${esc(im.apelido)} — ${esc(im.endereco)}, competência ${compNome(c.competencia)}.</p>
    <table><thead><tr><th style="text-align:left">Descrição</th><th style="text-align:left">Recebedor</th><th style="text-align:right">Valor</th></tr></thead>
    <tbody>${c.itens.map(i => `<tr><td>${esc(i.desc)}</td><td>${i.recebedor === "imobiliaria" ? esc(S.imobiliaria.nome) : esc(pessoa(l.proprietarioId).nome)}</td><td style="text-align:right">${money(i.valor)}</td></tr>`).join("")}
      <tr><td colspan="2"><strong>Total</strong></td><td style="text-align:right"><strong>${money(totais(c).geral)}</strong></td></tr></tbody></table>

let MODAL = null;
function modal(titulo, corpo, rodape) {
  fecharModal();
  const d = document.createElement("div");
  d.className = "scrim"; d.id = "scrim";
  d.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="modal-head"><h2>${esc(titulo)}</h2><button class="iconbtn" data-act="fecharModal" aria-label="Fechar">×</button></div>
    <div class="modal-body">${corpo}</div>
    ${rodape ? `<div class="modal-body" style="padding-top:0">${rodape}</div>` : ""}
  </div>`;
  d.addEventListener("click", e => { if (e.target === d) fecharModal(); });
  document.body.appendChild(d); MODAL = d;
  const f = d.querySelector("input,select,textarea,button.primary"); if (f) f.focus();
}
function fecharModal() { if (MODAL) { MODAL.remove(); MODAL = null; } }
function imprimir(html) { document.getElementById("print-area").innerHTML = html; window.print(); }

/* ============ leitura de arquivo ============ */
function lerArquivo(input, cb) {
  const f = input && input.files && input.files[0];
  if (!f) { cb(null); return; }
  const meta = { nome: f.name, tamanho: f.size, mime: f.type || "application/octet-stream", dataUrl: null };
  if (f.type.startsWith("image/") && f.size <= 420000) {
    const r = new FileReader();
    r.onload = () => { meta.dataUrl = r.result; cb(meta); };
    r.onerror = () => cb(meta);
    r.readAsDataURL(f);
  } else cb(meta);
}

  vazio(); vazio(); vazio(); vazio();

  const blocos = [
    { lado: 0, titulo: "Totais por origem", cab: "Origem", dados: porOrigem },
    { lado: 1, titulo: "Totais por forma", cab: "Forma", dados: porForma },
    { lado: 0, titulo: "Totais por inquilino", cab: "Inquilino", dados: porInquilino },
    { lado: 1, titulo: "Totais por recebedor", cab: "Para quem", dados: porRecebedor },
    { lado: 0, titulo: "Totais por imóvel", cab: "Imóvel", dados: porImovel }
  ];
  const grade = {}, marcar = (r, c, v) => { grade[r] = grade[r] || []; grade[r][c] = v; };
  let linhaEsq = linhas.length + 1, linhaDir = linhas.length + 1;
  blocos.forEach(b => {
    const col = b.lado === 0 ? 0 : 4;
    let r = b.lado === 0 ? linhaEsq : linhaDir;
    marcar(r, col, { t: b.titulo, s: 3 });
    merges.push(colNome(col) + r + ":" + colNome(col + 2) + r);
    r++;
    marcar(r, col, { t: b.cab, s: 4 }); marcar(r, col + 1, { t: "Total (R$)", s: 4 }); marcar(r, col + 2, { t: "Qtd", s: 4 });
    r++;
    b.dados.forEach(d => {
      marcar(r, col, { t: d[0], s: 6 }); marcar(r, col + 1, { n: d[1].toFixed(2), s: 5 }); marcar(r, col + 2, { n: d[2], s: 6 });
      r++;
    });
    if (!b.dados.length) { marcar(r, col, { t: "Nenhum pagamento", s: 6 }); r++; }
    r++;
    if (b.lado === 0) linhaEsq = r; else linhaDir = r;
  });
  const ultima = Math.max(linhaEsq, linhaDir);
  for (let r = linhas.length + 1; r <= ultima; r++) linhas.push(grade[r] || []);

  const cab = ["Data", "Competência", "Inquilino", "Imóvel", "Para quem", "Forma", "Repasse", "Origem", "Valor (R$)", "Registrado por"];
  const lanc = [
    [{ t: "LANÇAMENTOS DE PAGAMENTOS", s: 1 }], [{ t: "Um pagamento por linha. Use os filtros do cabeçalho para separar por inquilino, forma ou origem.", s: 2 }], [],
    cab.map(c => ({ t: c, s: 4 }))
  ];
  pgs.forEach(p => {
    const n = nome(p);
    lanc.push([
      { t: dBR(p.data), s: 6 }, { t: compLabel(p.competencia), s: 6 }, { t: n.inquilino, s: 6 }, { t: n.imovel, s: 6 },
      { t: n.paraQuem, s: 6 }, { t: p.forma, s: 6 }, { t: detalheRepasse(p, p.locacaoId), s: 6 },
      { t: p.origem, s: 6 }, { n: Number(p.valor).toFixed(2), s: 5 }, { t: p.registradoPor || "—", s: 6 }
    ]);
  });
  if (!pgs.length) lanc.push([{ t: "Nenhum pagamento registrado nesta competência.", s: 6 }]);

  baixarXlsx(`Altha_Relatorio_Pagamentos_${comp.replace("-", "_")}.xlsx`, [
    { nome: "Visão Geral", linhas, opcoes: { merges, alturas, larguras: [26, 14, 8, 3, 26, 14, 8, 3] } },
    { nome: "Lançamentos", linhas: lanc, opcoes: { merges: ["A1:J1", "A2:J2"], larguras: [12, 13, 24, 26, 24, 10, 42, 20, 14, 26], filtro: "A4:J4", congelar: 4 } }
  ]);
  marca("relatorios");
};

    </div>`;

    <div class="small" style="font-weight:500">${esc(cp.nome)}</div>
    <div class="tiny muted" style="margin-top:4px">${kb(cp.tamanho)} · enviado ${dHora(cp.enviadoEm)}</div>
    <div class="tiny muted" style="margin-top:6px">Este é um comprovante de exemplo do piloto, sem arquivo real anexado.</div>
  </div>`;
}
function analisaAuto(cp) {
  const c = cobranca(cp.cobrancaId);
  if (!c) return null;
  const t = totais(c);
  const esperado = cp.recebedor === "imobiliaria" ? t.saldoImobiliaria : t.saldoProprietario;
  const lido = Number(cp.valorInformado || 0);
  const receb = recebimentoDe(cp.locacaoId, cp.recebedor);
  const dif = Math.abs(esperado - lido);
  const pontos = [];
  pontos.push({ ok: lido > 0, t: "Valor lido no comprovante", v: lido ? money(lido) : "não identificado" });
  pontos.push({ ok: dif <= 0.01, t: "Confere com o saldo em aberto", v: dif <= 0.01 ? "sim, " + money(esperado) : "não, saldo é " + money(esperado) });
  pontos.push({ ok: true, t: "Data informada", v: dBR((cp.dataPagamento || cp.enviadoEm).slice(0, 10)) });
  pontos.push({ ok: receb.forma !== "PIX" || !!receb.chave, t: receb.forma === "PIX" ? "Chave que deveria receber" : "Forma combinada", v: receb.forma === "PIX" ? (receb.chave || "não cadastrada") : receb.forma });
  const duplicado = S.comprovantes.some(x => x.id !== cp.id && x.cobrancaId === cp.cobrancaId && x.recebedor === cp.recebedor && x.status !== "recusado" && Math.abs((x.valorInformado || 0) - lido) < 0.01);
  if (duplicado) pontos.push({ ok: false, t: "Possível envio repetido", v: "já existe comprovante igual nesta cobrança" });
  const alertas = pontos.filter(x => !x.ok).length;
  return { pontos, alertas, esperado, lido, sugestao: lido > 0 ? lido : esperado };
}
function blocoAnalise(a) {
  if (!a) return "";
  return `<div class="lane" style="border-left-color:var(--${a.alertas ? "warn" : "ok"});background:var(--surface-2);margin-bottom:14px">
    <div class="small" style="font-weight:500">Leitura automática ${a.alertas ? "· " + a.alertas + (a.alertas === 1 ? " ponto para conferir" : " pontos para conferir") : "· tudo confere"}</div>
    <div class="stack" style="gap:4px;margin-top:6px">
      ${a.pontos.map(p => `<div class="spread small"><span class="muted">${p.ok ? "✓" : "!"} ${esc(p.t)}</span><span>${esc(p.v)}</span></div>`).join("")}
    </div>
    <div class="tiny muted" style="margin-top:6px">No sistema real esta leitura vem do OCR do arquivo. A confirmação continua sendo sua.</div>
  </div>`;
}

/* -- recibo: emitido automaticamente na confirmação do pagamento -- */
function emiteRecibo(c) {
  const t = totais(c);
  if (t.pagoGeral <= 0.004) return null;
  if (t.saldoGeral > 0.004) return null;
  let r = S.recibos.find(x => x.cobrancaId === c.id);
  if (r) {
    if (Math.abs(r.valor - t.pagoGeral) < 0.005) return r;
    r.valor = t.pagoGeral; r.em = hojeISO(); r.emitidoPor = quemSou(); r.versao = (r.versao || 1) + 1;
    paraDrive(r.nome, "Recibos", c.locacaoId, c.competencia);
    log(c.locacaoId, c.competencia, `Recibo ${r.numero} reemitido com o total de ${money(r.valor)}.`, origemAtual());
  } else {
    const num = String(S.recibos.length + 1).padStart(4, "0") + "/" + c.competencia.slice(0, 4);
    r = {
      id: uid("rc"), numero: num, cobrancaId: c.id, locacaoId: c.locacaoId, competencia: c.competencia,
      valor: t.pagoGeral, em: hojeISO(), emitidoPor: quemSou(), versao: 1,
      nome: nomeArquivo("Recibos", { locacaoId: c.locacaoId, competencia: c.competencia, numero: num, ext: "pdf" })
    };
    S.recibos.push(r);
    paraDrive(r.nome, "Recibos", c.locacaoId, c.competencia);
    log(c.locacaoId, c.competencia, `Cobrança quitada. Recibo ${num} de ${money(r.valor)} emitido automaticamente e salvo no Google Drive.`, origemAtual());
    marca("recibo");
  }
  return r;
}
function mostraRecibo(r, novo) {
  if (!r) return;
  save(); render();
  modal(novo ? "Recibo emitido" : "Recibo", reciboHTML(r),
    `<div class="row"><button class="btn grow" data-act="fecharModal">Fechar</button><button class="btn primary grow" data-act="imprimirRecibo" data-id="${r.id}">Salvar em PDF</button></div>`);
}

/* -- gerador de xlsx (zip sem compressão, escrito à mão) -- */
const CRC_TAB = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }

function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TAB[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipar(arquivos) {
  const enc = new TextEncoder();
